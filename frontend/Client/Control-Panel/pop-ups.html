<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GUI Modal System - FTP Server</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#50c2f7",
                        "danger": "#ff4d4d",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101c22",
                    },
                    fontFamily: { "display": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        .modal-overlay {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
        }

        .modal-container {
            transform: scale(0.9) translateY(20px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-container.active {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-background-dark font-display text-white p-10">

    <div class="max-w-md mx-auto space-y-6">
        <h1 class="text-2xl font-bold mb-8">GUI Style Pop-up System</h1>

        <button onclick="showConfirmModal()"
            class="w-full py-4 bg-primary/10 text-primary border border-primary/20 rounded-2xl font-bold hover:bg-primary/20 transition-all">
            Test Confirmation Modal
        </button>

        <button onclick="showAlertModal()"
            class="w-full py-4 bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 rounded-2xl font-bold hover:bg-yellow-500/20 transition-all">
            Test Alert Modal
        </button>

        <button onclick="showDeleteModal()"
            class="w-full py-4 bg-danger/10 text-danger border border-danger/20 rounded-2xl font-bold hover:bg-danger/20 transition-all">
            Test Danger Modal
        </button>
    </div>

    <!-- REUSABLE MODAL COMPONENT (Should be injected or present in every page) -->
    <div id="gui-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-6 hidden">
        <!-- Backdrop -->
        <div id="modal-backdrop" class="modal-overlay absolute inset-0"></div>

        <!-- Modal Content -->
        <div id="modal-content"
            class="modal-container relative w-full max-w-[340px] glass-panel rounded-[2rem] overflow-hidden shadow-2xl">
            <div class="p-8 text-center">
                <!-- Icon Header -->
                <div id="modal-icon-container"
                    class="mx-auto size-20 rounded-full flex items-center justify-center mb-6">
                    <span id="modal-icon" class="material-symbols-outlined text-[40px]"></span>
                </div>

                <!-- Text Header -->
                <h3 id="modal-title" class="text-xl font-bold text-white mb-2 leading-tight"></h3>
                <p id="modal-message" class="text-slate-400 text-sm leading-relaxed mb-8 px-2"></p>

                <!-- Actions -->
                <div class="flex flex-col gap-3">
                    <button id="modal-primary-btn"
                        class="h-14 w-full rounded-2xl font-bold text-lg shadow-lg transition-all active:scale-95"></button>
                    <button id="modal-secondary-btn" onclick="closeGuiModal()"
                        class="h-14 w-full rounded-2xl font-bold text-slate-400 hover:text-white transition-colors"></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * GLOBAL MODAL ENGINE
         */
        const modalEl = document.getElementById('gui-modal');
        const backdrop = document.getElementById('modal-backdrop');
        const content = document.getElementById('modal-content');
        const mIconContainer = document.getElementById('modal-icon-container');
        const mIcon = document.getElementById('modal-icon');
        const mTitle = document.getElementById('modal-title');
        const mMsg = document.getElementById('modal-message');
        const mPrimaryBtn = document.getElementById('modal-primary-btn');
        const mSecondaryBtn = document.getElementById('modal-secondary-btn');

        let onPrimaryAction = null;

        function openGuiModal({ title, message, icon, type, primaryText, secondaryText, onPrimary }) {
            // Setup content
            mTitle.innerText = title;
            mMsg.innerText = message;
            mIcon.innerText = icon;
            mPrimaryBtn.innerText = primaryText || 'Confirm';
            mSecondaryBtn.innerText = secondaryText || 'Cancel';
            onPrimaryAction = onPrimary;

            // Type styling
            mIconContainer.className = "mx-auto size-20 rounded-full flex items-center justify-center mb-6 ";
            mPrimaryBtn.className = "h-14 w-full rounded-2xl font-bold text-lg shadow-lg transition-all active:scale-95 ";

            if (type === 'danger') {
                mIconContainer.classList.add('bg-danger/10', 'text-danger');
                mPrimaryBtn.classList.add('bg-danger', 'text-white', 'shadow-danger/20');
            } else if (type === 'alert') {
                mIconContainer.classList.add('bg-yellow-500/10', 'text-yellow-500');
                mPrimaryBtn.classList.add('bg-yellow-500', 'text-white', 'shadow-yellow-500/20');
            } else {
                mIconContainer.classList.add('bg-primary/10', 'text-primary');
                mPrimaryBtn.classList.add('bg-primary', 'text-white', 'shadow-primary/20');
            }

            // Show animation
            modalEl.classList.remove('hidden');
            setTimeout(() => {
                backdrop.classList.add('active');
                content.classList.add('active');
            }, 10);
        }

        function closeGuiModal() {
            backdrop.classList.remove('active');
            content.classList.remove('active');
            setTimeout(() => {
                modalEl.classList.add('hidden');
            }, 300);
        }

        // Primary Button Handler
        mPrimaryBtn.onclick = () => {
            if (onPrimaryAction) onPrimaryAction();
            closeGuiModal();
        };

        // Examples
        function showConfirmModal() {
            openGuiModal({
                title: 'Proceed Connection?',
                message: 'Do you want to establish a secure connection to the specified FTP host?',
                icon: 'encrypted',
                type: 'info',
                primaryText: 'Connect Now',
                onPrimary: () => console.log('Connecting...')
            });
        }

        function showAlertModal() {
            openGuiModal({
                title: 'Storage Full',
                message: 'You have exceeded your local storage quota. Please clean up files.',
                icon: 'warning',
                type: 'alert',
                primaryText: 'Manage Files',
                onPrimary: () => console.log('Cleanup started')
            });
        }

        function showDeleteModal() {
            openGuiModal({
                title: 'Terminate Session?',
                message: 'This will forcibly disconnect the user 192.168.10.5 from the server instantly.',
                icon: 'person_remove',
                type: 'danger',
                primaryText: 'Disconnect',
                onPrimary: () => console.log('User disconnected')
            });
        }
    </script>
</body>

</html>
