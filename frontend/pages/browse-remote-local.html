<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dual Browser - FTP Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#50c2f7", "background-dark": "#101c22", "danger": "#ff4d4d", "success": "#00db84" },
                    fontFamily: { "display": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden">
    <div
        class="relative flex min-h-screen w-full flex-col max-w-7xl mx-auto shadow-2xl bg-background-dark md:my-8 md:rounded-[2rem] overflow-hidden lg:h-[90dvh]">
        <!-- Header -->
        <header class="sticky top-0 z-20 bg-background-dark border-b border-slate-800">
            <div class="flex items-center p-4 pb-0 justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="Components.toggleMenu()"
                        class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-3xl">menu</span>
                    </button>
                    <div class="flex flex-col">
                        <h2 id="server-name" class="text-white text-lg font-bold">Remote Server</h2>
                        <p id="server-info" class="text-[#9cb0ba] text-xs">Connecting...</p>
                    </div>
                </div>
            </div>

            <!-- Context Tabs -->
            <div class="flex border-b border-[#3b4c54] px-4 mt-4">
                <button id="tab-remote" onclick="switchPane('remote')"
                    class="relative flex flex-col items-center justify-center pb-3 flex-1 transition-colors">
                    <p class="text-primary text-sm font-bold uppercase">Remote</p>
                    <div id="remote-indicator" class="absolute bottom-0 w-full h-[3px] bg-primary"></div>
                </button>
                <button id="tab-local" onclick="switchPane('local')"
                    class="relative flex flex-col items-center justify-center pb-3 flex-1 text-slate-400 transition-colors">
                    <p class="text-sm font-bold uppercase">Local</p>
                    <div id="local-indicator" class="absolute bottom-0 w-full h-[3px] bg-primary hidden"></div>
                </button>
            </div>

            <!-- Global Toolbar -->
            <div class="flex items-center gap-2 bg-slate-900/30 px-4 py-2 border-b border-slate-800">
                <button onclick="refreshCurrent()"
                    class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-700 transition-colors"
                    title="Refresh">
                    <span class="material-symbols-outlined text-[20px]">refresh</span>
                </button>
                <button id="toggle-hidden-btn" onclick="toggleHiddenFiles()"
                    class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-700 transition-colors opacity-50"
                    title="Toggle Hidden">
                    <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                </button>
                <div class="flex-1"></div>
                <button id="toggle-select-mode" onclick="toggleSelectionMode()"
                    class="flex items-center justify-center gap-1.5 px-3 h-9 rounded-lg hover:bg-slate-700 transition-all border border-white/5 text-slate-400"
                    title="Selection Mode">
                    <span class="material-symbols-outlined text-[18px]">rule</span>
                    <span class="text-[10px] font-black uppercase tracking-widest hidden sm:inline">Select</span>
                </button>
                <div id="pane-selection-indicator"
                    class="bg-primary/10 text-primary px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">
                    Remote View</div>
            </div>

            <!-- Dynamic Breadcrumbs -->
            <div class="flex items-center gap-2 bg-slate-900/50 px-4 py-3 border-b border-white/5">
                <button onclick="goUp()"
                    class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-700 transition-colors shrink-0">
                    <span class="material-symbols-outlined text-[20px]">arrow_upward</span>
                </button>
                <div id="breadcrumb-path"
                    class="flex items-center gap-1 overflow-x-auto whitespace-nowrap scrollbar-hide flex-1"></div>
            </div>
        </header>

        <main class="flex-1 flex flex-col pb-24 relative min-h-0 lg:pb-0">
            <!-- Remote Pane -->
            <div id="remote-pane" class="flex-1 flex flex-col overflow-y-auto">
                <div class="hidden items-center gap-2 px-4 py-2 bg-white/5 border-b border-white/5">
                    <button onclick="goUp('remote')"
                        class="flex items-center justify-center size-6 rounded hover:bg-white/10 text-slate-400 hover:text-white transition-colors">
                        <span class="material-symbols-outlined text-[16px]">arrow_upward</span>
                    </button>
                    <div id="remote-breadcrumbs"
                        class="flex-1 flex items-center gap-1 overflow-x-auto whitespace-nowrap scrollbar-hide"></div>
                    <span id="remote-count" class="text-[10px] text-slate-500 font-bold shrink-0"></span>
                </div>
                <div id="remote-list" class="flex flex-col min-h-[100px]" onclick="switchPane('remote')"></div>
                <div id="remote-empty"
                    class="hidden flex flex-col items-center justify-center py-20 text-slate-400 text-center">
                    <span class="material-symbols-outlined text-6xl mb-4 opacity-20">cloud_off</span>
                    <p class="font-bold text-xl text-slate-300">No Files Found</p>
                </div>
            </div>

            <!-- Local Pane -->
            <div id="local-pane" class="hidden flex-1 flex flex-col overflow-y-auto">
                <div class="hidden items-center gap-2 px-4 py-2 bg-white/5 border-b border-white/5">
                    <button onclick="goUp('local')"
                        class="flex items-center justify-center size-6 rounded hover:bg-white/10 text-slate-400 hover:text-white transition-colors">
                        <span class="material-symbols-outlined text-[16px]">arrow_upward</span>
                    </button>
                    <div id="local-breadcrumbs"
                        class="flex-1 flex items-center gap-1 overflow-x-auto whitespace-nowrap scrollbar-hide"></div>
                    <span id="local-count" class="text-[10px] text-slate-500 font-bold shrink-0"></span>
                </div>
                <div id="local-list" class="flex flex-col min-h-[100px]" onclick="switchPane('local')"></div>
                <div id="local-empty"
                    class="hidden flex flex-col items-center justify-center py-20 text-slate-400 text-center">
                    <span class="material-symbols-outlined text-6xl mb-4 opacity-20">folder_off</span>
                    <p class="font-bold text-xl text-slate-300">Local Folder Empty</p>
                </div>
            </div>

            <!-- Loading Indicator Overlay -->
            <div id="sync-overlay"
                class="absolute inset-0 bg-background-dark/80 backdrop-blur-sm z-30 flex items-center justify-center hidden">
                <div class="flex flex-col items-center gap-4">
                    <div class="animate-spin size-10 border-4 border-primary border-t-transparent rounded-full"></div>
                    <p class="text-xs font-black uppercase tracking-[0.2em] text-primary">Syncing Files...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- File Actions Modal -->
    <div id="options-modal"
        class="fixed inset-0 z-40 hidden flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
        <div id="options-modal-content"
            class="bg-[#1b2327] border border-white/10 rounded-[2rem] w-full max-w-xs overflow-hidden shadow-2xl transition-all transform scale-95 opacity-0">
            <div class="p-6 border-b border-white/5 bg-white/5">
                <p id="options-filename" class="text-sm font-bold text-white truncate"></p>
                <p id="options-type" class="text-[10px] text-slate-500 uppercase tracking-widest font-black mt-1">
                    Actions</p>
            </div>
            <div class="p-4 flex flex-col gap-2">
                <button id="btn-preview"
                    class="flex items-center gap-3 w-full px-5 py-4 rounded-2xl hover:bg-primary/10 text-primary transition-all active:scale-95">
                    <span class="material-symbols-outlined">visibility</span>
                    <span class="text-sm font-bold">Preview</span>
                </button>
                <button id="btn-copy"
                    class="flex items-center gap-3 w-full px-5 py-4 rounded-2xl hover:bg-white/5 text-white transition-all active:scale-95">
                    <span class="material-symbols-outlined">content_copy</span>
                    <span class="text-sm font-bold">Copy</span>
                </button>
                <button id="btn-delete"
                    class="flex items-center gap-3 w-full px-5 py-4 rounded-2xl hover:bg-danger/10 text-danger transition-all active:scale-95">
                    <span class="material-symbols-outlined">delete</span>
                    <span class="text-sm font-bold">Delete Item</span>
                </button>
            </div>
            <button onclick="closeOptionsModal()"
                class="w-full py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 hover:text-white border-t border-white/5 transition-colors">Cancel</button>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="fixed inset-0 z-50 hidden flex flex-col bg-background-dark transition-all">
        <header
            class="flex items-center justify-between p-4 border-b border-white/5 bg-background-dark/95 backdrop-blur-md">
            <div class="flex items-center gap-3 overflow-hidden">
                <button onclick="Preview.close()"
                    class="size-10 flex items-center justify-center rounded-full hover:bg-white/10 text-slate-200">
                    <span class="material-symbols-outlined text-2xl">arrow_back</span>
                </button>
                <div class="flex flex-col overflow-hidden">
                    <p id="preview-filename" class="text-sm font-bold text-white truncate"></p>
                    <div class="flex flex-col overflow-hidden text-right">
                        <p class="text-[10px] text-primary font-black uppercase tracking-widest">Instant Preview</p>
                        <p class="text-[8px] text-slate-500 font-bold uppercase tracking-widest">Read-only</p>
                    </div>
                </div>
            </div>
        </header>
        <div class="flex-1 overflow-auto bg-black/40 flex items-center justify-center relative">
            <div id="preview-container" class="w-full h-full p-4 flex items-center justify-center overflow-auto">
                <!-- Content goes here -->
            </div>
        </div>
    </div>

    <div id="paste-bar"
        class="fixed bottom-24 lg:bottom-8 left-1/2 -translate-x-1/2 z-30 hidden w-[calc(100%-48px)] max-w-sm transition-all duration-300">
        <div class="bg-primary shadow-2xl shadow-primary/30 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="size-9 bg-white/20 rounded-lg flex items-center justify-center text-white">
                    <span class="material-symbols-outlined text-xl">content_paste</span>
                </div>
                <div class="flex flex-col overflow-hidden">
                    <p id="paste-message" class="text-[10px] font-black uppercase tracking-widest text-white/70">Ready
                        to Paste</p>
                    <p id="paste-info" class="text-xs font-bold text-white truncate"></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearClipboard()" class="p-2 text-white/70 hover:text-white">
                    <span class="material-symbols-outlined text-xl">close</span>
                </button>
                <button id="btn-delete-selected" onclick="deleteSelected()"
                    class="hidden px-5 py-2 bg-danger text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">Delete
                    All</button>
                <button id="btn-paste-action" onclick="pasteFiles()"
                    class="px-5 py-2 bg-white text-primary rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">Paste
                    All</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/preview.js"></script>

    <script type="module">
        import { FTP_API } from '../assets/js/ftp-api.js';
        import { Renderer } from '../assets/js/ftp-renderer.js';
        import { state, ui } from '../assets/js/ftp-state.js';

        Components.injectSidebar('browse-remote-local');
        Components.injectModal();

        // Extra UI elements not in shared state
        const optModal = document.getElementById('options-modal');
        const optContent = document.getElementById('options-modal-content');
        const paneInd = document.getElementById('pane-selection-indicator');
        const bc = document.getElementById('breadcrumb-path');
        const serverNameEl = document.getElementById('server-name');
        const serverInfoEl = document.getElementById('server-info');
        let currentServer = null;

        // --- Pane Management ---
        function switchPane(pane) {
            state.activePane = pane;

            const tRem = document.getElementById('tab-remote');
            const tLoc = document.getElementById('tab-local');
            const iRem = document.getElementById('remote-indicator');
            const iLoc = document.getElementById('local-indicator');
            const rPane = document.getElementById('remote-pane');
            const lPane = document.getElementById('local-pane');
            const paneInd = document.getElementById('pane-selection-indicator');

            if (pane === 'remote') {
                tRem.classList.remove('text-slate-400', 'text-slate-500'); tRem.classList.add('text-primary');
                tLoc.classList.remove('text-primary'); tLoc.classList.add('text-slate-400');
                iRem.classList.remove('hidden'); iLoc.classList.add('hidden');
                rPane.classList.remove('hidden'); lPane.classList.add('hidden');
                paneInd.innerText = 'Remote View';

                // Header Updates for Mobile/Tablet/Laptop (Single View)
                if (currentServer) {
                    serverNameEl.innerText = currentServer.name;
                    serverInfoEl.innerText = `${currentServer.host}:${currentServer.port}`;
                }

                renderBreadcrumbs(state.currentRemotePath, 'remote');
            } else {
                tLoc.classList.remove('text-slate-400', 'text-slate-500'); tLoc.classList.add('text-primary');
                tRem.classList.remove('text-primary'); tRem.classList.add('text-slate-400');
                iLoc.classList.remove('hidden'); iRem.classList.add('hidden');
                lPane.classList.remove('hidden'); rPane.classList.add('hidden');
                paneInd.innerText = 'Local View';

                // Header Updates
                serverNameEl.innerText = "Local Storage";
                serverInfoEl.innerText = "Internal Device";

                renderBreadcrumbs(state.currentLocalPath, 'local');
            }
            updatePasteBarVisibility();
        }

        // --- Data Fetching ---
        async function fetchFiles(type, path) {
            ui.loader.classList.remove('hidden');
            try {
                const data = await FTP_API.fetchFiles(type, path);
                Renderer.renderList(type, data, path, handleAction);
                renderBreadcrumbs(path, type);
            } catch (e) {
                Components.showToast(e.message, 'error');
            } finally {
                ui.loader.classList.add('hidden');
            }
        }

        function handleAction(e, entry, normalizedPath, type) {
            if (!optModal.classList.contains('hidden')) return;

            const optBtn = e.target.closest('.options-trigger');
            if (optBtn) {
                e.stopPropagation();
                if (type === 'remote') openRemoteOptions(entry, normalizedPath);
                else openLocalOptions(entry, normalizedPath);
                return;
            }

            if (state.selectionMode) {
                toggleSelection(normalizedPath, entry.Name, entry.IsFolder, type);
            } else {
                if (entry.IsFolder) {
                    if (type === 'remote') {
                        state.currentRemotePath = normalizedPath;
                        fetchFiles('remote', state.currentRemotePath);
                    } else {
                        state.currentLocalPath = normalizedPath;
                        fetchFiles('local', state.currentLocalPath);
                    }
                } else {
                    Preview.show(normalizedPath, entry.Name, type === 'remote');
                }
            }
        }

        // --- Breadcrumbs (Kept Local as not in Renderer) ---
        function renderBreadcrumbs(path, type) {
            const buildInto = (container, p, t) => {
                if (!container) return;
                container.innerHTML = '';
                const isLocal = t === 'local';
                const parts = p.split('/').filter(part => part && part !== '.');

                const root = document.createElement('p');
                root.className = `text-xs font-black uppercase tracking-widest cursor-pointer hover:underline px-2 py-1 rounded transition-colors ${isLocal ? 'text-success' : 'text-primary'}`;
                root.innerText = isLocal ? "Local" : "Remote";
                root.onclick = () => {
                    if (isLocal) { state.currentLocalPath = '.'; fetchFiles('local', '.'); }
                    else { state.currentRemotePath = '.'; fetchFiles('remote', '.'); }
                };
                container.appendChild(root);

                let build = isLocal ? '.' : '';
                parts.forEach(part => {
                    build += `/${part}`;
                    const sep = document.createElement('span');
                    sep.className = "text-slate-600 px-1";
                    sep.innerHTML = '<span class="material-symbols-outlined text-xs">chevron_right</span>';
                    container.appendChild(sep);

                    const node = document.createElement('p');
                    node.className = "text-xs font-bold text-slate-300 hover:text-white cursor-pointer px-2 py-1 rounded hover:bg-white/5 truncate max-w-[120px] transition-colors";
                    node.innerText = part;
                    const target = build;
                    node.onclick = () => {
                        if (isLocal) { state.currentLocalPath = target; fetchFiles('local', target); }
                        else { state.currentRemotePath = target; fetchFiles('remote', target); }
                    };
                    container.appendChild(node);
                });
            };

            if (state.activePane === type) {
                buildInto(bc, path, type);
            }

            const specific = document.getElementById(`${type}-breadcrumbs`);
            buildInto(specific, path, type);
        }

        // --- Selection ---
        function toggleSelectionMode() {
            state.selectionMode = !state.selectionMode;
            ui.sBtn.classList.toggle('bg-primary', state.selectionMode);
            ui.sBtn.classList.toggle('text-white', state.selectionMode);
            ui.sBtn.classList.toggle('text-slate-400', !state.selectionMode);
            ui.sBtn.querySelector('span').innerText = state.selectionMode ? 'done_all' : 'rule';
            updatePasteBarVisibility();
            refreshCurrent();
        }

        function toggleSelection(path, name, isFolder, pane) {
            const index = state.clipboard.findIndex(f => f.path === path && f.pane === pane);
            if (index > -1) {
                state.clipboard.splice(index, 1);
            } else {
                if (state.clipboard.length > 0 && state.clipboard[0].pane !== pane) state.clipboard.length = 0;
                state.clipboard.push({ path, name, isFolder, pane });
            }
            updatePasteBarVisibility();
            refreshCurrent();
        }

        function clearClipboard() {
            state.clipboard.length = 0;
            updatePasteBarVisibility();
            refreshCurrent();
        }

        function updatePasteBarVisibility() {
            const hasSelection = state.clipboard.length > 0;
            const btnPaste = document.getElementById('btn-paste-action');
            const btnDelete = document.getElementById('btn-delete-selected');
            const msg = document.getElementById('paste-message');
            const info = document.getElementById('paste-info');

            if (hasSelection) {
                ui.pasteBar.classList.remove('hidden');
                setTimeout(() => ui.pasteBar.classList.add('opacity-100', 'translate-y-0'), 10);

                const selectedPane = state.clipboard[0].pane;
                info.innerText = state.clipboard.length === 1 ? state.clipboard[0].name : `${state.clipboard.length} items`;

                if (state.selectionMode) {
                    btnDelete.classList.remove('hidden');
                    btnPaste.classList.add('hidden');
                    msg.innerText = "Items Selected";
                } else {
                    btnDelete.classList.add('hidden');
                    if (selectedPane !== state.activePane) {
                        btnPaste.classList.remove('hidden');
                        msg.innerText = `Ready to ${selectedPane === 'remote' ? 'Copy' : 'Upload'}`;
                    } else {
                        btnPaste.classList.add('hidden');
                        msg.innerText = "Items in Clipboard";
                    }
                }
            } else {
                ui.pasteBar.classList.remove('opacity-100', 'translate-y-0');
                setTimeout(() => { if (state.clipboard.length === 0) ui.pasteBar.classList.add('hidden'); }, 300);
            }
        }

        // --- File Actions ---
        function openRemoteOptions(entry, path) {
            document.getElementById('options-filename').innerText = entry.Name;
            document.getElementById('options-type').innerText = "Remote " + (entry.IsFolder ? "Folder" : "File") + " Actions";
            optModal.classList.remove('hidden');
            setTimeout(() => {
                optContent.classList.remove('scale-95', 'opacity-0');
                optContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            document.getElementById('btn-preview').classList.toggle('hidden', entry.IsFolder);
            document.getElementById('btn-preview').onclick = () => { closeOptionsModal(); Preview.show(path, entry.Name, true); };
            document.getElementById('btn-copy').onclick = () => { closeOptionsModal(); toggleSelection(path, entry.Name, entry.IsFolder, 'remote'); };
            document.getElementById('btn-delete').classList.add('hidden');
        }

        function openLocalOptions(entry, path) {
            document.getElementById('options-filename').innerText = entry.Name;
            document.getElementById('options-type').innerText = "Local " + (entry.IsFolder ? "Folder" : "File") + " Actions";
            optModal.classList.remove('hidden');
            setTimeout(() => {
                optContent.classList.remove('scale-95', 'opacity-0');
                optContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            const btnPreview = document.getElementById('btn-preview');
            btnPreview.classList.toggle('hidden', entry.IsFolder);
            btnPreview.onclick = () => { closeOptionsModal(); Preview.show(path, entry.Name, false); };
            document.getElementById('btn-copy').onclick = () => { closeOptionsModal(); toggleSelection(path, entry.Name, entry.IsFolder, 'local'); };
            document.getElementById('btn-delete').classList.remove('hidden');
            document.getElementById('btn-delete').onclick = () => { closeOptionsModal(); confirmDelete(path, entry.Name, false); };
        }


        function closeOptionsModal() {
            optContent.classList.add('scale-95', 'opacity-0');
            optContent.classList.remove('scale-100', 'opacity-100');
            setTimeout(() => { optModal.classList.add('hidden'); }, 300);
        }

        function confirmDelete(path, name, isRemote) {
            Components.openGuiModal({
                title: 'Delete Item?',
                message: `Are you sure you want to delete ${name}? This action cannot be undone.`,
                icon: 'delete_forever',
                type: 'danger',
                primaryText: 'Delete',
                onPrimary: () => performDelete(path, isRemote)
            });
        }

        async function performDelete(path, isRemote) {
            ui.loader.classList.remove('hidden');
            try {
                await FTP_API.deleteItem(path, isRemote);
                Components.showToast('Item deleted');
                refreshCurrent();
            } catch (e) {
                Components.showToast(e.message, 'error');
            } finally {
                ui.loader.classList.add('hidden');
            }
        }

        async function deleteSelected() {
            Components.openGuiModal({
                title: 'Delete Selected?',
                message: `Are you sure you want to delete ${state.clipboard.length} items?`,
                icon: 'delete_sweep',
                type: 'danger',
                primaryText: 'Delete All',
                onPrimary: async () => {
                    ui.loader.classList.remove('hidden');
                    const isRemote = state.clipboard[0].pane === 'remote';
                    try {
                        for (const item of state.clipboard) {
                            await FTP_API.deleteItem(item.path, isRemote);
                        }
                        Components.showToast('Selected items deleted');
                        clearClipboard();
                        refreshCurrent();
                    } catch (e) {
                        Components.showToast(e.message, 'error');
                    } finally {
                        ui.loader.classList.add('hidden');
                    }
                }
            });
        }

        async function pasteFiles() {
            if (state.clipboard.length === 0) return;
            const isRemoteToLocal = state.clipboard[0].pane === 'remote';
            ui.loader.classList.remove('hidden');

            try {
                for (const item of state.clipboard) {
                    const targetPath = isRemoteToLocal ? state.currentLocalPath : state.currentRemotePath;
                    await FTP_API.transferFile(item, targetPath, isRemoteToLocal);
                }
                Components.showToast('Operation complete');
                clearClipboard();

                if (isRemoteToLocal) fetchFiles('local', state.currentLocalPath);
                else fetchFiles('remote', state.currentRemotePath);

            } catch (e) {
                Components.showToast(e.message, 'error');
            } finally {
                ui.loader.classList.add('hidden');
            }
        }


        function refreshCurrent() {
            if (state.activePane === 'remote') fetchFiles('remote', state.currentRemotePath);
            else fetchFiles('local', state.currentLocalPath);
        }

        function goUp(paneOverride) {
            const pane = paneOverride || state.activePane;
            let path = pane === 'remote' ? state.currentRemotePath : state.currentLocalPath;
            const parts = path.split('/').filter(p => p && p !== '.');
            parts.pop();
            const isLocal = pane === 'local';
            const newPath = isLocal ?
                (parts.length === 0 ? '.' : './' + parts.join('/')) :
                (parts.length === 0 ? '.' : parts.join('/'));

            if (isLocal) { state.currentLocalPath = newPath; fetchFiles('local', newPath); }
            else { state.currentRemotePath = newPath; fetchFiles('remote', newPath); }
        }

        function toggleHiddenFiles() {
            state.showHidden = !state.showHidden;
            ui.hBtn.classList.toggle('opacity-50', !state.showHidden);
            ui.hBtn.querySelector('span').innerText = state.showHidden ? 'visibility' : 'visibility_off';
            refreshCurrent();
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            const serverId = localStorage.getItem('current_server_id');
            const servers = JSON.parse(localStorage.getItem('ftp_servers') || '[]');
            const server = servers.find(s => s.id == serverId);

            if (server) {
                currentServer = server; // Store for switching
                document.getElementById('server-name').innerText = server.name;
                document.getElementById('server-info').innerText = `${server.host}:${server.port}`;
                fetchFiles('remote', '.');
                fetchFiles('local', '.');
            } else {
                window.location.href = 'remote-connections.html';
            }
        });

        // --- Exports ---
        window.switchPane = switchPane;
        window.refreshCurrent = refreshCurrent;
        window.toggleHiddenFiles = toggleHiddenFiles;
        window.toggleSelectionMode = toggleSelectionMode;
        window.goUp = goUp;
        window.closeOptionsModal = closeOptionsModal;
        window.clearClipboard = clearClipboard;
        window.deleteSelected = deleteSelected;
        window.pasteFiles = pasteFiles;
    </script>

</body>

</html>
