<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dual Browser - FTP Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#50c2f7", "background-dark": "#101c22" },
                    fontFamily: { "display": ["Inter"] },
                },
            },
        }
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden">
    <div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto shadow-2xl bg-background-dark">
        <!-- Header -->
        <header class="sticky top-0 z-20 bg-background-dark border-b border-slate-800">
            <div class="flex items-center p-4 pb-0 justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="Components.toggleMenu()"
                        class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-3xl">menu</span>
                    </button>
                    <div class="flex flex-col">
                        <h2 id="server-name" class="text-white text-lg font-bold">Remote Server</h2>
                        <p id="server-info" class="text-[#9cb0ba] text-xs">Connecting...</p>
                    </div>
                </div>
            </div>

            <!-- Context Tabs -->
            <div class="flex border-b border-[#3b4c54] px-4 mt-4">
                <button id="tab-remote" onclick="switchPane('remote')"
                    class="relative flex flex-col items-center justify-center pb-3 flex-1 transition-colors">
                    <p class="text-primary text-sm font-bold uppercase">Remote</p>
                    <div id="remote-indicator" class="absolute bottom-0 w-full h-[3px] bg-primary"></div>
                </button>
                <button id="tab-local" onclick="switchPane('local')"
                    class="relative flex flex-col items-center justify-center pb-3 flex-1 text-slate-400 transition-colors">
                    <p class="text-sm font-bold uppercase">Local</p>
                    <div id="local-indicator" class="absolute bottom-0 w-full h-[3px] bg-primary hidden"></div>
                </button>
            </div>

            <!-- Global Toolbar -->
            <div class="flex items-center gap-2 bg-slate-900/30 px-4 py-2 border-b border-slate-800">
                <button onclick="refreshCurrent()"
                    class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-700 transition-colors"
                    title="Refresh">
                    <span class="material-symbols-outlined text-[20px]">refresh</span>
                </button>
                <button id="toggle-hidden-btn" onclick="toggleHiddenFiles()"
                    class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-700 transition-colors opacity-50"
                    title="Toggle Hidden">
                    <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                </button>
                <div class="flex-1"></div>
                <div id="pane-selection-indicator"
                    class="bg-primary/10 text-primary px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest">
                    Remote View</div>
            </div>

            <!-- Dynamic Breadcrumbs -->
            <div class="flex items-center gap-2 bg-slate-900/50 px-4 py-3">
                <button onclick="goUp()"
                    class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-700 transition-colors shrink-0">
                    <span class="material-symbols-outlined text-[20px]">arrow_upward</span>
                </button>
                <div id="breadcrumb-path"
                    class="flex items-center gap-1 overflow-x-auto whitespace-nowrap scrollbar-hide flex-1"></div>
            </div>
        </header>

        <main class="flex-1 flex flex-col pb-24 relative min-h-0">
            <!-- Remote Pane -->
            <div id="remote-pane" class="flex-1 flex flex-col overflow-y-auto">
                <div id="remote-list" class="flex flex-col"></div>
                <div id="remote-empty"
                    class="hidden flex flex-col items-center justify-center py-20 text-slate-400 text-center">
                    <span class="material-symbols-outlined text-6xl mb-4 opacity-20">cloud_off</span>
                    <p class="font-bold text-xl text-slate-300">No Files Found</p>
                </div>
            </div>

            <!-- Local Pane -->
            <div id="local-pane" class="hidden flex-1 flex flex-col overflow-y-auto">
                <div id="local-list" class="flex flex-col"></div>
                <div id="local-empty"
                    class="hidden flex flex-col items-center justify-center py-20 text-slate-400 text-center">
                    <span class="material-symbols-outlined text-6xl mb-4 opacity-20">folder_off</span>
                    <p class="font-bold text-xl text-slate-300">Local Folder Empty</p>
                </div>
            </div>

            <!-- Loading Indicator Overlay -->
            <div id="sync-overlay"
                class="absolute inset-0 bg-background-dark/80 backdrop-blur-sm z-30 flex items-center justify-center hidden">
                <div class="flex flex-col items-center gap-4">
                    <div class="animate-spin size-10 border-4 border-primary border-t-transparent rounded-full"></div>
                    <p class="text-xs font-black uppercase tracking-[0.2em] text-primary">Syncing Files...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- File Actions Modal -->
    <div id="options-modal"
        class="fixed inset-0 z-40 hidden flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
        <div id="options-modal-content"
            class="bg-[#1b2327] border border-white/10 rounded-[2rem] w-full max-w-xs overflow-hidden shadow-2xl transition-all transform scale-95 opacity-0">
            <div class="p-6 border-b border-white/5 bg-white/5">
                <p id="options-filename" class="text-sm font-bold text-white truncate"></p>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest font-black mt-1">Remote File Actions</p>
            </div>
            <div class="p-4 flex flex-col gap-2">
                <button id="btn-preview"
                    class="flex items-center gap-3 w-full px-5 py-4 rounded-2xl hover:bg-primary/10 text-primary transition-all active:scale-95">
                    <span class="material-symbols-outlined">visibility</span>
                    <span class="text-sm font-bold">Preview</span>
                </button>
                <button id="btn-copy"
                    class="flex items-center gap-3 w-full px-5 py-4 rounded-2xl hover:bg-white/5 text-white transition-all active:scale-95">
                    <span class="material-symbols-outlined">content_copy</span>
                    <span class="text-sm font-bold">Copy to Local</span>
                </button>
                <button id="btn-download"
                    class="flex items-center gap-3 w-full px-5 py-4 rounded-2xl hover:bg-white/5 text-slate-400 transition-all active:scale-95">
                    <span class="material-symbols-outlined">download</span>
                    <span class="text-sm font-bold">Download</span>
                </button>
            </div>
            <button onclick="closeOptionsModal()"
                class="w-full py-5 text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 hover:text-white border-t border-white/5 transition-colors">Cancel</button>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="fixed inset-0 z-50 hidden flex flex-col bg-background-dark transition-all">
        <header
            class="flex items-center justify-between p-4 border-b border-white/5 bg-background-dark/95 backdrop-blur-md">
            <div class="flex items-center gap-3 overflow-hidden">
                <button onclick="closePreviewModal()"
                    class="size-10 flex items-center justify-center rounded-full hover:bg-white/10 text-slate-200">
                    <span class="material-symbols-outlined text-2xl">arrow_back</span>
                </button>
                <div class="flex flex-col overflow-hidden">
                    <p id="preview-filename" class="text-sm font-bold text-white truncate"></p>
                    <p class="text-[10px] text-primary font-black uppercase tracking-widest">Remote Preview</p>
                </div>
            </div>
            <button id="btn-preview-download-direct"
                class="px-4 py-2 rounded-lg bg-primary/10 text-primary text-[10px] font-black uppercase tracking-widest hover:bg-primary/20">Download</button>
        </header>
        <div class="flex-1 overflow-auto bg-black/40 flex items-center justify-center relative">
            <div id="preview-container" class="w-full h-full p-4 flex items-center justify-center overflow-auto">
                <!-- Content goes here -->
            </div>
        </div>
    </div>

    <!-- Floating Paste Bar -->
    <div id="paste-bar" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-30 hidden w-[calc(100%-48px)] max-w-sm">
        <div class="bg-primary shadow-2xl shadow-primary/30 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="size-9 bg-white/20 rounded-lg flex items-center justify-center text-white">
                    <span class="material-symbols-outlined text-xl">content_paste</span>
                </div>
                <div class="flex flex-col overflow-hidden">
                    <p class="text-[10px] font-black uppercase tracking-widest text-white/70">Ready to Paste</p>
                    <p id="paste-current-file" class="text-xs font-bold text-white truncate"></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearClipboard()" class="p-2 text-white/70 hover:text-white">
                    <span class="material-symbols-outlined text-xl">close</span>
                </button>
                <button onclick="pasteFile()"
                    class="px-5 py-2 bg-white text-primary rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg">Paste
                    Here</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        Components.injectSidebar('browse-remote-local');

        // State
        let activePane = 'remote'; // 'remote' or 'local'
        let currentRemotePath = '/';
        let currentLocalPath = '.';
        let showHidden = false;

        // Clipboard for Copy-Paste
        let clipboard = {
            remotePath: null,
            name: null
        };

        // UI Elements
        const rList = document.getElementById('remote-list');
        const lList = document.getElementById('local-list');
        const rPane = document.getElementById('remote-pane');
        const lPane = document.getElementById('local-pane');
        const bc = document.getElementById('breadcrumb-path');
        const loader = document.getElementById('sync-overlay');
        const hBtn = document.getElementById('toggle-hidden-btn');
        const paneInd = document.getElementById('pane-selection-indicator');

        // Modal Elements
        const optModal = document.getElementById('options-modal');
        const optContent = document.getElementById('options-modal-content');
        const prevModal = document.getElementById('preview-modal');
        const prevContainer = document.getElementById('preview-container');
        const pasteBar = document.getElementById('paste-bar');

        /**
         * Pane Management
         */
        function switchPane(pane) {
            activePane = pane;

            // Tab UI
            const tRem = document.getElementById('tab-remote');
            const tLoc = document.getElementById('tab-local');
            const iRem = document.getElementById('remote-indicator');
            const iLoc = document.getElementById('local-indicator');

            if (pane === 'remote') {
                tRem.classList.remove('text-slate-400'); tRem.classList.add('text-primary');
                tLoc.classList.remove('text-primary'); tLoc.classList.add('text-slate-400');
                iRem.classList.remove('hidden'); iLoc.classList.add('hidden');
                rPane.classList.remove('hidden'); lPane.classList.add('hidden');
                paneInd.innerText = 'Remote View';
                renderBreadcrumbs(currentRemotePath);
            } else {
                tLoc.classList.remove('text-slate-400'); tLoc.classList.add('text-primary');
                tRem.classList.remove('text-primary'); tRem.classList.add('text-slate-400');
                iLoc.classList.remove('hidden'); iRem.classList.add('hidden');
                lPane.classList.remove('hidden'); rPane.classList.add('hidden');
                paneInd.innerText = 'Local View';
                renderBreadcrumbs(currentLocalPath);
                updatePasteBarVisibility();
            }
        }

        /**
         * Data Fetching
         */
        async function fetchFiles(type, path) {
            const api = type === 'remote' ? '/api/ftp/server/ls' : '/api/ftp/client/ls';
            loader.classList.remove('hidden');
            try {
                const res = await fetch(`${api}?path=${encodeURIComponent(path)}`);
                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                renderList(type, data, path);
            } catch (e) {
                Components.showToast(e.message, 'error');
            } finally {
                loader.classList.add('hidden');
            }
        }

        /**
         * Rendering
         */
        function renderList(type, entries, path) {
            const container = type === 'remote' ? rList : lList;
            const empty = document.getElementById(`${type}-empty`);
            container.innerHTML = '';

            const visible = entries.filter(e => showHidden || !Utils.isHiddenFile(e.Name))
                .sort((a, b) => (b.IsFolder - a.IsFolder) || a.Name.localeCompare(b.Name));

            if (visible.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            visible.forEach(entry => {
                const item = document.createElement('div');
                item.className = "flex items-center gap-4 px-4 py-3 hover:bg-white/5 cursor-pointer border-b border-white/5 group transition-colors";
                const icon = Utils.getFileIcon(entry.Name, entry.IsFolder);
                const color = Utils.getColorClass(entry.Name, entry.IsFolder);

                item.innerHTML = `
                    <div class="size-11 rounded-xl flex items-center justify-center ${color} shadow-sm">
                        <span class="material-symbols-outlined">${icon}</span>
                    </div>
                    <div class="flex flex-col flex-1 overflow-hidden">
                        <span class="text-sm font-bold truncate text-white">${entry.Name}</span>
                        <span class="text-[10px] text-slate-500 font-medium uppercase">${entry.IsFolder ? 'Folder' : Utils.formatFileSize(entry.Size)} • ${Utils.formatDate(entry.LastModified)}</span>
                    </div>
                    <span class="material-symbols-outlined text-slate-600 group-hover:text-primary transition-colors">chevron_right</span>
                `;

                item.onclick = () => {
                    const fullPath = (path === '/' || path === '.') ? `${path === '/' ? '' : path}/${entry.Name}` : `${path}/${entry.Name}`;
                    const normalizedPath = fullPath.replace('//', '/');

                    if (entry.IsFolder) {
                        if (type === 'remote') {
                            currentRemotePath = normalizedPath;
                            fetchFiles('remote', currentRemotePath);
                        } else {
                            currentLocalPath = normalizedPath;
                            fetchFiles('local', currentLocalPath);
                        }
                    } else {
                        if (type === 'remote') {
                            openFileOptions(entry, normalizedPath);
                        } else {
                            Components.showToast(`Opening ${entry.Name}`);
                        }
                    }
                };
                container.appendChild(item);
            });

            if (activePane === type) renderBreadcrumbs(path);
        }

        function renderBreadcrumbs(path) {
            bc.innerHTML = '';
            const isLocal = activePane === 'local';
            const parts = path.split('/').filter(p => p && p !== '.');

            const root = document.createElement('p');
            root.className = "text-xs font-black uppercase tracking-widest text-primary cursor-pointer hover:bg-primary/10 px-2 py-1 rounded";
            root.innerText = isLocal ? "Local" : "Remote";
            root.onclick = () => {
                if (isLocal) { currentLocalPath = '.'; fetchFiles('local', '.'); }
                else { currentRemotePath = '/'; fetchFiles('remote', '/'); }
            };
            bc.appendChild(root);

            let build = isLocal ? '.' : '';
            parts.forEach(p => {
                build += `/${p}`;
                const sep = document.createElement('span');
                sep.className = "text-slate-600";
                sep.innerHTML = '<span class="material-symbols-outlined text-xs">chevron_right</span>';
                bc.appendChild(sep);

                const node = document.createElement('p');
                node.className = "text-xs font-bold text-slate-300 hover:text-white cursor-pointer px-2 py-1 rounded hover:bg-white/5 truncate max-w-[100px]";
                node.innerText = p;
                const target = build;
                node.onclick = () => {
                    if (isLocal) { currentLocalPath = target; fetchFiles('local', target); }
                    else { currentRemotePath = target; fetchFiles('remote', target); }
                };
                bc.appendChild(node);
            });
        }

        /**
         * File Actions Logic
         */
        function openFileOptions(entry, path) {
            document.getElementById('options-filename').innerText = entry.Name;
            optModal.classList.remove('hidden');
            setTimeout(() => {
                optContent.classList.remove('scale-95', 'opacity-0');
                optContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            // Bind Actions
            document.getElementById('btn-preview').onclick = () => { closeOptionsModal(); previewFile(path, entry.Name); };
            document.getElementById('btn-copy').onclick = () => { closeOptionsModal(); copyFile(path, entry.Name); };
            document.getElementById('btn-download').onclick = () => {
                closeOptionsModal();
                window.open(`/api/ftp/server/get-file?path=${encodeURIComponent(path)}`, '_blank');
            };
        }

        function closeOptionsModal() {
            optContent.classList.add('scale-95', 'opacity-0');
            optContent.classList.remove('scale-100', 'opacity-100');
            setTimeout(() => { optModal.classList.add('hidden'); }, 300);
        }

        /**
         * Preview Logic
         */
        async function previewFile(path, name) {
            document.getElementById('preview-filename').innerText = name;
            document.getElementById('btn-preview-download-direct').onclick = () => {
                window.open(`/api/ftp/server/get-file?path=${encodeURIComponent(path)}`, '_blank');
            };

            prevModal.classList.remove('hidden');
            prevContainer.innerHTML = `
                <div class="flex flex-col items-center gap-4">
                    <div class="animate-spin size-10 border-4 border-primary border-t-transparent rounded-full"></div>
                    <p class="text-xs font-black text-primary uppercase">Fetching Content...</p>
                </div>
            `;

            const ext = name.split('.').pop().toLowerCase();
            const previewUrl = `/api/ftp/server/get-file?path=${encodeURIComponent(path)}`;

            try {
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) {
                    prevContainer.innerHTML = `<img src="${previewUrl}" class="max-w-full max-h-full object-contain shadow-2xl rounded-lg">`;
                } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                    prevContainer.innerHTML = `<video controls src="${previewUrl}" class="max-w-full max-h-full"></video>`;
                } else if (['pdf'].includes(ext)) {
                    prevContainer.innerHTML = `<iframe src="${previewUrl}" class="w-full h-full border-0"></iframe>`;
                } else {
                    // Try to fetch as text
                    const res = await fetch(previewUrl);
                    if (res.ok) {
                        const text = await res.text();
                        prevContainer.innerHTML = `<pre class="w-full h-full p-4 text-xs font-mono text-slate-300 overflow-auto whitespace-pre-wrap selection:bg-primary/30">${Utils.escapeHtml(text)}</pre>`;
                    } else {
                        prevContainer.innerHTML = `<div class="text-center"><p class="text-slate-500 italic">Preview not available for this file type.</p></div>`;
                    }
                }
            } catch (e) {
                prevContainer.innerHTML = `<div class="text-center text-red-400 font-bold"><p>Error loading preview</p></div>`;
            }
        }

        function closePreviewModal() {
            prevModal.classList.add('hidden');
            prevContainer.innerHTML = '';
        }

        // Helper to escape HTML for preview
        Utils.escapeHtml = (text) => {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        };

        /**
         * Copy-Paste Logic
         */
        function copyFile(path, name) {
            clipboard.remotePath = path;
            clipboard.name = name;
            Components.showToast(`Path copied: ${name}`);
            updatePasteBarVisibility();
        }

        function clearClipboard() {
            clipboard.remotePath = null;
            clipboard.name = null;
            updatePasteBarVisibility();
        }

        function updatePasteBarVisibility() {
            if (activePane === 'local' && clipboard.remotePath) {
                document.getElementById('paste-current-file').innerText = clipboard.name;
                pasteBar.classList.remove('hidden');
            } else {
                pasteBar.classList.add('hidden');
            }
        }

        async function pasteFile() {
            if (!clipboard.remotePath) return;

            const targetLocalPath = (currentLocalPath === '.' ? '' : currentLocalPath) + '/' + clipboard.name;
            const normalizedLocalPath = targetLocalPath.replace('//', '/');

            loader.classList.remove('hidden');
            try {
                const params = new URLSearchParams();
                params.append('remote_path', clipboard.remotePath);
                params.append('local_path', normalizedLocalPath);

                const res = await fetch('/api/ftp/client/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });

                if (res.ok) {
                    Components.showToast('File downloaded successfully');
                    fetchFiles('local', currentLocalPath);
                } else {
                    const err = await res.text();
                    throw new Error(err || 'Failed to download file');
                }
            } catch (e) {
                Components.showToast(e.message, 'error');
            } finally {
                loader.classList.add('hidden');
            }
        }

        /**
         * Controls
         */
        function refreshCurrent() {
            if (activePane === 'remote') fetchFiles('remote', currentRemotePath);
            else fetchFiles('local', currentLocalPath);
        }

        function goUp() {
            let path = activePane === 'remote' ? currentRemotePath : currentLocalPath;
            const parts = path.split('/').filter(p => p && p !== '.');
            parts.pop();
            const isLocal = activePane === 'local';
            const newPath = isLocal ?
                (parts.length === 0 ? '.' : './' + parts.join('/')) :
                (parts.length === 0 ? '/' : '/' + parts.join('/'));

            if (isLocal) { currentLocalPath = newPath; fetchFiles('local', newPath); }
            else { currentRemotePath = newPath; fetchFiles('remote', newPath); }
        }

        function toggleHiddenFiles() {
            showHidden = !showHidden;
            hBtn.classList.toggle('opacity-50', !showHidden);
            hBtn.querySelector('span').innerText = showHidden ? 'visibility' : 'visibility_off';
            refreshCurrent();
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            const serverId = localStorage.getItem('current_server_id');
            const servers = JSON.parse(localStorage.getItem('ftp_servers') || '[]');
            const server = servers.find(s => s.id == serverId);

            if (server) {
                document.getElementById('server-name').innerText = server.name;
                document.getElementById('server-info').innerText = `${server.host}:${server.port}`;
                fetchFiles('remote', '/');
                fetchFiles('local', '.');
            } else {
                window.location.href = 'remote-connections.html';
            }
        });
    </script>
</body>

</html>
