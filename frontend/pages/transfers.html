<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>File Transfers Progress</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#38bdf8",
                        "background-light": "#f8fafc",
                        "background-dark": "#0f172a",
                        "surface-dark": "#1e293b",
                        "accent-orange": "#f97316",
                        "accent-blue": "#3b82f6",
                        "accent-purple": "#a855f7",
                        "accent-green": "#22c55e",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .progress-glow {
            box-shadow: 0 0 8px currentColor;
        }

        .scroll-container {
            -webkit-overflow-scrolling: touch;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div class="h-12 w-full bg-background-light dark:bg-background-dark sticky top-0 z-50"></div>
    <main class="max-w-md mx-auto min-h-screen flex flex-col pb-24">
        <header
            class="px-6 py-4 flex items-center justify-between sticky top-12 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-40 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <button onclick="Components.toggleMenu()"
                    class="p-2 -ml-2 rounded-full active:bg-slate-200 dark:active:bg-slate-800 transition-colors">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h1 class="text-xl font-bold tracking-tight">Transfers</h1>
            </div>
            <button class="text-sm font-medium text-primary hover:opacity-80 transition-opacity">
                Clear All
            </button>
        </header>

        <div class="px-6 mt-4">
            <div class="flex gap-4 border-b border-slate-200 dark:border-slate-800">
                <button class="pb-3 text-sm font-semibold border-b-2 border-primary text-primary">Active (<span
                        id="active-count">0</span>)</button>
                <button
                    class="pb-3 text-sm font-semibold text-slate-500 dark:text-slate-400 border-b-2 border-transparent">Completed</button>
            </div>
        </div>

        <section id="transfer-list" class="flex-1 px-6 mt-6 space-y-6 scroll-container">
            <!-- Transfers will be injected here -->
            <div class="flex flex-col items-center justify-center py-20 text-slate-400 text-center opacity-50">
                <span class="material-symbols-outlined text-6xl mb-4">sync_disabled</span>
                <p class="font-bold text-lg">No Active Transfers</p>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Components.injectSidebar('transfers');
        });
    </script>
    <script type="module" src="../assets/js/pages/transfers.js"></script>
</body>

</html>
