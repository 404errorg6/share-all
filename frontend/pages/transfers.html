<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>File Transfers Progress</title>
    <script src="../assets/vendor/tailwind-cdn.min.js"></script>
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#50c2f7",
                        "background-light": "#f5f7f8",
                        "background-dark": "#101c22",
                        "surface-dark": "#1b2327",
                        "accent-orange": "#f97316",
                        "accent-blue": "#3b82f6",
                        "accent-purple": "#a855f7",
                        "accent-green": "#22c55e",
                    },
                    fontFamily: {
                        display: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .progress-glow {
            box-shadow: 0 0 8px currentColor;
        }

        .scroll-container {
            -webkit-overflow-scrolling: touch;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div class="h-12 w-full bg-background-light dark:bg-background-dark sticky top-0 z-50"></div>
    <main class="max-w-md mx-auto min-h-screen flex flex-col pb-24">
        <header
            class="px-6 py-4 flex items-center justify-between sticky top-12 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-40 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <button onclick="Components.toggleMenu()"
                    class="p-2 -ml-2 rounded-full active:bg-slate-200 dark:active:bg-slate-800 transition-colors">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <h1 class="text-xl font-bold tracking-tight">Transfers</h1>
            </div>
        </header>

        <section class="flex-1 px-6 mt-6 pb-20 space-y-8 scroll-container">
            <!-- Active Transfers -->
            <div>
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                    Active <span id="active-count"
                        class="bg-primary/10 text-primary px-2 py-0.5 rounded-full text-[10px]">0</span>
                </h2>
                <div id="transfer-list" class="space-y-4 min-h-[100px]">
                    <!-- Active Items / Empty State -->
                    <div class="flex flex-col items-center justify-center py-10 text-slate-400 text-center opacity-50">
                        <span class="material-symbols-outlined text-4xl mb-2">sync_disabled</span>
                        <p class="font-medium text-sm">No Active Transfers</p>
                    </div>
                </div>
            </div>

            <!-- Completed Transfers -->
            <div>
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Completed</h2>
                <div id="completed-list" class="space-y-4">
                    <!-- Completed items will go here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            Components.injectSidebar('transfers');
        });
    </script>
    <script type="module" src="../assets/js/pages/transfers.js"></script>
</body>

</html>
