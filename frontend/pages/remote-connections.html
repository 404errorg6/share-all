<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Remote Connections - FTP Manager</title>
    <link rel="stylesheet" href="../assets/vendor/tailwind.min.css">
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden">
    <div
        class="relative flex min-h-screen w-full flex-col max-w-4xl mx-auto shadow-2xl bg-background-dark md:my-8 md:rounded-[2rem] overflow-hidden">
        <!-- Header -->
        <header class="sticky top-0 z-20 bg-background-dark/95 backdrop-blur-md border-b border-slate-800 p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="Components.toggleMenu()"
                        class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-3xl">menu</span>
                    </button>
                    <h2 class="text-xl font-bold leading-tight tracking-tight text-white">Remote Connections</h2>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="window.location.href='../forms/form-remote-manager.html'"
                        class="flex size-10 items-center justify-center rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
                        <span class="material-symbols-outlined">add</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 flex flex-col p-4 gap-8" id="connections-container">
            <!-- Saved Connections Section -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-black text-slate-500 uppercase tracking-[0.2em] ml-1">Saved Connections</h3>
                    <div class="h-px flex-1 bg-white/5 mx-4"></div>
                </div>

                <div id="empty-state"
                    class="hidden flex flex-col items-center justify-center py-12 text-slate-400 text-center bg-slate-800/10 rounded-[2rem] border border-dashed border-white/5">
                    <span class="material-symbols-outlined text-5xl mb-3 opacity-20">cloud_off</span>
                    <p class="font-bold text-lg text-slate-300">No Servers Saved</p>
                    <p class="text-xs opacity-50 mt-1 max-w-[200px]">Your manually added servers will appear here.</p>
                </div>

                <div id="server-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>

            <!-- Discovery Section -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h3
                        class="text-sm font-black text-slate-500 uppercase tracking-[0.2em] ml-1 flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary text-lg animate-pulse">radar</span>
                        Auto-Discovery
                    </h3>
                    <div class="h-px flex-1 bg-white/5 mx-4"></div>
                    <button id="rescan-btn" onclick="RemoteConnections.discoverServers()"
                        class="flex items-center gap-1 text-[10px] font-bold text-primary bg-primary/10 px-3 py-1.5 rounded-full hover:bg-primary/20 transition-all">
                        <span class="material-symbols-outlined text-sm">refresh</span> RE-SCAN
                    </button>
                </div>

                <div id="discovery-state"
                    class="hidden py-16 flex flex-col items-center justify-center bg-slate-800/10 rounded-[2rem] border border-white/5">
                    <div class="size-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin mb-4">
                    </div>
                    <p class="text-sm font-bold text-slate-300">Scanning Network</p>
                    <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-widest font-medium">Looking for active
                        FTP servers...</p>
                </div>

                <div id="discovery-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>
        </main>
    </div>

    <!-- Login Modal -->
    <div id="login-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-6 hidden">
        <div id="login-modal-backdrop" class="modal-overlay absolute inset-0"
            onclick="RemoteConnections.closeLoginModal()"></div>
        <div id="login-modal-content"
            class="modal-container relative w-full max-w-[360px] glass-panel rounded-[2.5rem] overflow-hidden shadow-2xl">
            <div class="p-8">
                <div class="flex items-center gap-4 mb-8">
                    <div class="size-20 rounded-2xl icon-glow-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-4xl">lock_open</span>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h3 id="login-server-name" class="text-xl font-bold text-white truncate leading-tight"></h3>
                        <p id="login-server-addr" class="text-slate-500 text-xs font-mono"></p>
                    </div>
                </div>

                <div class="space-y-4 mb-8">
                    <div class="group">
                        <label
                            class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2 ml-1">Username</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl group-focus-within:text-primary transition-colors">person</span>
                            <input type="text" id="login-user"
                                class="w-full h-14 bg-white/[0.03] border border-white/10 rounded-2xl pl-12 pr-5 text-white focus:border-primary/50 focus:bg-primary/[0.02] outline-none transition-all"
                                placeholder="Enter username">
                        </div>
                    </div>
                    <div class="group">
                        <label
                            class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2 ml-1">Password</label>
                        <div class="relative">
                            <span
                                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl group-focus-within:text-primary transition-colors">key</span>
                            <input type="password" id="login-pass"
                                class="w-full h-14 bg-white/[0.03] border border-white/10 rounded-2xl pl-12 pr-5 text-white focus:border-primary/50 focus:bg-primary/[0.02] outline-none transition-all"
                                placeholder="••••••••">
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-3">
                    <button onclick="RemoteConnections.submitLogin()"
                        class="h-16 w-full modal-btn-primary text-white rounded-2xl font-bold text-lg transition-all active:scale-95 shadow-lg">Connect
                        Server</button>
                    <button onclick="RemoteConnections.closeLoginModal()"
                        class="h-12 w-full rounded-xl font-bold text-slate-500 hover:text-white transition-colors">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/pages/remote-connections.js"></script>
    <script>
        Components.injectSidebar('remote-connections');
        Components.injectModal();
    </script>
</body>

</html>
