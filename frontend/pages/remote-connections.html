<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Remote Connections - FTP Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: { "primary": "#50c2f7", "background-dark": "#101c22", "surface-dark": "#1b2327" },
                },
            },
        }
    </script>
</head>

<body class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden">
    <div class="relative flex min-h-screen w-full flex-col max-w-md mx-auto shadow-2xl bg-background-dark">
        <!-- Header -->
        <header class="sticky top-0 z-20 bg-background-dark/95 backdrop-blur-md border-b border-slate-800 p-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="Components.toggleMenu()"
                        class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-3xl">menu</span>
                    </button>
                    <h2 class="text-xl font-bold leading-tight tracking-tight text-white">Remote Connections</h2>
                </div>
                <div class="flex items-center gap-1">
                    <button onclick="window.location.href='../forms/form-remote-add.html'"
                        class="flex size-10 items-center justify-center rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors">
                        <span class="material-symbols-outlined">add</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="flex-1 flex flex-col p-4 gap-4" id="connections-container">
            <div id="empty-state"
                class="hidden flex flex-col items-center justify-center py-20 text-slate-400 text-center">
                <span class="material-symbols-outlined text-6xl mb-4 opacity-20">cloud_off</span>
                <p class="font-bold text-xl text-slate-300">No Servers Added</p>
                <p class="text-sm opacity-60 mt-2 max-w-[240px]">Save your remote FTP servers here for quick access.</p>
                <button onclick="window.location.href='../forms/form-remote-add.html'"
                    class="mt-8 px-8 py-3 bg-primary text-white rounded-xl font-bold shadow-lg shadow-primary/20 transition-all active:scale-95">
                    Add My First Server
                </button>
            </div>

            <div id="server-list" class="flex flex-col gap-3"></div>
        </main>
    </div>

    <!-- Core Scripts -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/components.js"></script>
    <script>
        Components.injectSidebar('remote-connections');
        Components.injectModal();

        const serverList = document.getElementById('server-list');
        const emptyState = document.getElementById('empty-state');

        function loadSavedServers() {
            const servers = JSON.parse(localStorage.getItem('ftp_servers') || '[]');
            if (servers.length === 0) {
                emptyState.classList.remove('hidden');
                serverList.innerHTML = '';
                return;
            }
            emptyState.classList.add('hidden');
            renderServers(servers);
        }

        function renderServers(servers) {
            serverList.innerHTML = '';
            servers.forEach(server => {
                const card = document.createElement('div');
                card.className = "flex flex-col bg-slate-800/40 border border-white/5 rounded-2xl overflow-hidden hover:border-primary/30 transition-all cursor-pointer group";
                card.onclick = (e) => {
                    if (e.target.closest('.action-btn')) return;
                    connectToServer(server);
                };

                card.innerHTML = `
                    <div class="p-4 flex items-center gap-4">
                        <div class="size-14 rounded-2xl bg-primary/10 flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-all shadow-inner">
                            <span class="material-symbols-outlined text-3xl">dns</span>
                        </div>
                        <div class="flex flex-col flex-1 overflow-hidden">
                            <h3 class="text-white font-bold truncate">${server.name}</h3>
                            <p class="text-slate-500 text-xs font-mono">${server.user}@${server.host}:${server.port}</p>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="editServer(${server.id})" class="action-btn size-10 rounded-full flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/10 transition-colors">
                                <span class="material-symbols-outlined text-lg">edit</span>
                            </button>
                            <button onclick="confirmDelete(${server.id})" class="action-btn size-10 rounded-full flex items-center justify-center text-slate-500 hover:text-danger hover:bg-danger/10 transition-colors">
                                <span class="material-symbols-outlined text-lg">delete</span>
                            </button>
                        </div>
                    </div>
                `;
                serverList.appendChild(card);
            });
        }

        async function connectToServer(server) {
            Components.showToast(`Connecting to ${server.name}...`, 'info');
            try {
                const params = new URLSearchParams();
                params.append('server_host', server.host);
                params.append('server_port', server.port);
                params.append('user', server.isAnon ? 'anonymous' : server.user);
                params.append('password', server.password || 'anonymous');
                params.append('anonymous', server.isAnon ? 'true' : 'false');

                const response = await fetch('/api/ftp/client/connect-to-server', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });

                const text = await response.text();
                if (response.ok || text.includes('already connected')) {
                    localStorage.setItem('current_server_id', server.id);
                    window.location.href = 'browse-remote.html';
                } else {
                    Components.showToast(`Connection failed: ${text}`, 'error');
                }
            } catch (err) {
                Components.showToast('Network error or server unreachable', 'error');
            }
        }

        function editServer(id) {
            window.location.href = `../forms/form-remote-edit.html?id=${id}`;
        }

        function confirmDelete(id) {
            Components.openGuiModal({
                title: 'Remove Server?',
                message: 'Are you sure you want to delete this server connection? This cannot be undone.',
                icon: 'delete_forever',
                type: 'danger',
                primaryText: 'Delete',
                onPrimary: () => {
                    let servers = JSON.parse(localStorage.getItem('ftp_servers') || '[]');
                    servers = servers.filter(s => s.id !== id);
                    localStorage.setItem('ftp_servers', JSON.stringify(servers));
                    Components.showToast('Server removed');
                    loadSavedServers();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadSavedServers);
    </script>
</body>

</html>
