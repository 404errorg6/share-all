<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Manage Remote - FTP Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body class="bg-background-dark font-display text-slate-100 p-6 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-sm bg-slate-800/40 rounded-[2.5rem] border border-white/5 p-8 shadow-2xl backdrop-blur-xl">
        <header class="flex flex-col items-center mb-10">
            <div
                class="size-16 rounded-3xl bg-primary/10 flex items-center justify-center text-primary mb-4 shadow-inner">
                <span class="material-symbols-outlined text-4xl">add_link</span>
            </div>
            <h1 id="page-title" class="text-2xl font-black text-white">Add Connection</h1>
            <p class="text-slate-500 text-xs mt-1 uppercase tracking-tighter">Remote FTP Server details</p>
        </header>

        <form id="server-form" class="space-y-5">
            <div class="space-y-1.5 px-1">
                <label class="text-[10px] uppercase font-black text-slate-500 flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[14px]">label</span> Display Name
                </label>
                <input type="text" id="name" required placeholder="My Home NAS"
                    class="w-full bg-black/40 border-white/5 rounded-2xl px-5 py-4 text-sm focus:ring-primary focus:border-primary placeholder:text-slate-700">
            </div>

            <div class="grid grid-cols-3 gap-3 px-1">
                <div class="col-span-2 space-y-1.5">
                    <label class="text-[10px] uppercase font-black text-slate-500">Host Address</label>
                    <input type="text" id="host" required placeholder="192.168.1.1"
                        class="w-full bg-black/40 border-white/5 rounded-2xl px-5 py-4 text-sm focus:ring-primary focus:border-primary placeholder:text-slate-700">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] uppercase font-black text-slate-500">Port</label>
                    <input type="number" id="port" value="2121"
                        class="w-full bg-black/40 border-white/5 rounded-2xl px-4 py-4 text-sm focus:ring-primary placeholder:text-slate-700">
                </div>
            </div>

            <div id="auth-fields" class="space-y-5">
                <div class="space-y-1.5 px-1">
                    <label class="text-[10px] uppercase font-black text-slate-500">Username</label>
                    <input type="text" id="user" value="anonymous"
                        class="w-full bg-black/40 border-white/5 rounded-2xl px-5 py-4 text-sm focus:ring-primary focus:border-primary">
                </div>
                <div class="space-y-1.5 px-1">
                    <label class="text-[10px] uppercase font-black text-slate-500">Password</label>
                    <input type="password" id="password" value="anonymous"
                        class="w-full bg-black/40 border-white/5 rounded-2xl px-5 py-4 text-sm focus:ring-primary focus:border-primary">
                </div>
            </div>

            <div class="p-4 bg-primary/5 rounded-3xl border border-primary/10 flex items-center justify-between">
                <div class="flex flex-col">
                    <span class="text-xs font-bold text-white">Anonymous Login</span>
                    <span class="text-[10px] text-primary/60 font-medium">No credentials required</span>
                </div>
                <div id="toggle-anon"
                    class="w-12 h-6 bg-primary rounded-full relative cursor-pointer p-1 transition-all">
                    <div id="toggle-knob" class="size-4 bg-white rounded-full absolute right-1"></div>
                </div>
            </div>

            <div class="pt-4 flex gap-3">
                <button type="button" onclick="window.history.back()"
                    class="flex-1 h-14 rounded-2xl font-bold text-slate-400 hover:text-white transition-colors">Cancel</button>
                <button type="submit"
                    class="flex-[2] h-14 rounded-2xl bg-primary text-white font-black text-lg shadow-lg shadow-primary/20 transition-all active:scale-95">SAVE</button>
            </div>
        </form>
    </div>

    <!-- Core Scripts -->
    <script src="../assets/js/components.js"></script>
    <script>
        const form = document.getElementById('server-form');
        const toggleAnon = document.getElementById('toggle-anon');
        const toggleKnob = document.getElementById('toggle-knob');
        const authFields = document.getElementById('auth-fields');
        let isAnon = true;
        let editId = new URLSearchParams(window.location.search).get('id');

        if (editId) {
            document.getElementById('page-title').innerText = 'Edit Connection';
            const servers = JSON.parse(localStorage.getItem('ftp_servers') || '[]');
            const server = servers.find(s => s.id == editId);
            if (server) {
                document.getElementById('name').value = server.name;
                document.getElementById('host').value = server.host;
                document.getElementById('port').value = server.port;
                document.getElementById('user').value = server.user;
                document.getElementById('password').value = server.password;
                isAnon = server.isAnon;
                updateAnonUI();
            }
        }

        function updateAnonUI() {
            if (isAnon) {
                toggleAnon.className = "w-12 h-6 bg-primary rounded-full relative cursor-pointer p-1 transition-all";
                toggleKnob.className = "size-4 bg-white rounded-full absolute right-1";
                authFields.classList.add('hidden');
            } else {
                toggleAnon.className = "w-12 h-6 bg-slate-700 rounded-full relative cursor-pointer p-1 transition-all";
                toggleKnob.className = "size-4 bg-white rounded-full absolute left-1";
                authFields.classList.remove('hidden');
            }
        }

        toggleAnon.onclick = () => { isAnon = !isAnon; updateAnonUI(); };

        form.onsubmit = (e) => {
            e.preventDefault();
            const servers = JSON.parse(localStorage.getItem('ftp_servers') || '[]');
            const entry = {
                id: editId || Date.now(),
                name: document.getElementById('name').value,
                host: document.getElementById('host').value,
                port: document.getElementById('port').value,
                user: isAnon ? 'anonymous' : document.getElementById('user').value,
                password: isAnon ? 'anonymous' : document.getElementById('password').value,
                isAnon
            };

            if (editId) {
                const idx = servers.findIndex(s => s.id == editId);
                servers[idx] = entry;
            } else {
                servers.push(entry);
            }

            localStorage.setItem('ftp_servers', JSON.stringify(servers));
            window.location.href = '../pages/remote-connections.html';
        };

        updateAnonUI();
    </script>
</body>

</html>
