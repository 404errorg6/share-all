<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Auto-Discovery - FTP Manager</title>
  <script type="module" src="/src/assets/vendor/tailwind-cdn.min.js"></script>
  <script type="module">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#50c2f7",
            "background-dark": "#101c22",
            "surface-dark": "#1b2327",
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/src/assets/css/fonts.css">
  <link rel="stylesheet" href="/src/assets/css/main.css">
</head>
<body v-cloak class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden">
  <div class="relative flex min-h-screen w-full flex-col max-w-none shadow-2xl bg-background-dark overflow-hidden">
    <header class="sticky top-0 z-20 bg-background-dark/95 backdrop-blur-md border-b border-white/5 p-4">
      <div class="flex items-center gap-3">
        <button onclick="globalThis.Router.navigate('/discover')" class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-slate-800 transition-colors">
          <span class="material-symbols-outlined text-3xl">arrow_back</span>
        </button>
        <div class="flex flex-col">
          <h2 class="text-xl font-bold text-white">Auto-Discovery</h2>
        </div>
      </div>
    </header>
    <main class="flex flex-col gap-4 p-4" id="connections-container">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-black text-slate-500 uppercase tracking-[0.2em] ml-1 flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-lg animate-pulse">radar</span>
          Scanning Network
        </h3>
        <button id="rescan-btn" onclick="RemoteConnections.discoverServers()" class="flex items-center gap-1 text-[10px] font-bold text-primary bg-primary/10 px-3 py-1.5 rounded-full hover:bg-primary/20 transition-all">
          <span class="material-symbols-outlined text-sm">refresh</span> RE-SCAN
        </button>
      </div>
      <div id="discovery-state" class="hidden py-12 flex flex-col items-center justify-center bg-slate-800/10 rounded-2xl border border-white/5">
        <div class="size-10 border-3 border-primary/20 border-t-primary rounded-full animate-spin mb-3"></div>
        <p class="text-sm font-bold text-slate-300">Scanning Network</p>
        <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-widest font-medium">Looking for active FTP servers...</p>
      </div>
      <div id="discovery-list" class="grid grid-cols-1 gap-3"></div>
    </main>
  </div>
  <div id="login-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-6 hidden">
    <div id="login-modal-backdrop" class="modal-overlay absolute inset-0 bg-black/60 backdrop-blur-sm" onclick="RemoteConnections.closeLoginModal()"></div>
    <div id="login-modal-content" class="modal-container relative w-full max-w-[360px] bg-slate-900 rounded-[2.5rem] overflow-hidden shadow-2xl transition-all scale-95 opacity-0">
      <div class="p-8">
        <div class="flex items-center gap-4 mb-8">
          <div class="size-20 rounded-2xl bg-primary/10 flex items-center justify-center text-primary">
            <span class="material-symbols-outlined text-4xl">lock_open</span>
          </div>
          <div class="flex-1 overflow-hidden">
            <h3 id="login-server-name" class="text-xl font-bold text-white truncate leading-tight"></h3>
            <p id="login-server-addr" class="text-slate-500 text-xs font-mono"></p>
          </div>
        </div>
        <div class="space-y-4 mb-8">
          <div class="group">
            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2 ml-1">Username</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl group-focus-within:text-primary transition-colors">person</span>
              <input type="text" id="login-user" class="w-full h-14 bg-white/[0.03] border border-white/10 rounded-2xl pl-12 pr-5 text-white focus:border-primary/50 focus:bg-primary/[0.02] outline-none transition-all" placeholder="Enter username">
            </div>
          </div>
          <div class="group">
            <label class="block text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-2 ml-1">Password</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl group-focus-within:text-primary transition-colors">key</span>
              <input type="password" id="login-pass" class="w-full h-14 bg-white/[0.03] border border-white/10 rounded-2xl pl-12 pr-5 text-white focus:border-primary/50 focus:bg-primary/[0.02] outline-none transition-all" placeholder="••••••••">
            </div>
          </div>
        </div>
        <div class="flex flex-col gap-3">
          <button id="submit-login-btn" onclick="RemoteConnections.submitLogin()" class="h-16 w-full bg-primary text-white rounded-2xl font-bold text-lg transition-all active:scale-95 shadow-lg">Connect Server</button>
          <button id="close-login-btn" onclick="RemoteConnections.closeLoginModal()" class="h-12 w-full rounded-xl font-bold text-slate-500 hover:text-white transition-colors">Cancel</button>
        </div>
      </div>
    </div>
  </div>
  <script src="/wails/ipc.js"></script>
  <script src="/wails/runtime.js"></script>
  <script type="module" src="/src/assets/js/utils.js"></script>
  <script type="module" src="/src/assets/js/components.js"></script>
  <script type="module" src="/src/assets/js/pages/discover-auto.js"></script>
  <script type="module">
    async function initializePageComponents() {
      try {
        if (window.Components && window.Components.ready) await window.Components.ready;
        if (window.Components && typeof window.Components.injectSidebar === 'function') {
          window.Components.injectSidebar('discover-servers');
          window.Components.injectModal();
        } else if (window.Components && window.Components.Sidebar && typeof window.Components.Sidebar.inject === 'function') {
          window.Components.Sidebar.inject('discover-servers');
          if (window.Components.Sidebar && typeof window.Components.Sidebar.injectModal === 'function') window.Components.Sidebar.injectModal();
        } else {
          console.error('Components failed to load');
        }
      } catch (err) {
        console.error('Failed to initialize components:', err);
      }
    }
    initializePageComponents().catch(err => console.error('Failed to initialize:', err));
  </script>
</body>
</html>
