<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Hosting Access - FTP Manager</title>
    <script src="/src/assets/vendor/tailwind-cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#50c2f7",
                        "background-dark": "#101c22",
                        "surface-dark": "#1b2327",
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="/src/assets/css/fonts.css">
    <link rel="stylesheet" href="/src/assets/css/main.css">
</head>

<body v-cloak class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden">
    <div
        class="relative flex min-h-screen w-full flex-col max-w-none shadow-2xl bg-background-dark overflow-hidden">
        <!-- Header -->
        <header class="sticky top-0 z-20 bg-background-dark/95 backdrop-blur-md border-b border-slate-800 p-4">
            <div class="flex items-center gap-3">
                <button onclick="Components.toggleMenu()"
                    class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-slate-800 transition-colors">
                    <span class="material-symbols-outlined text-3xl">menu</span>
                </button>
                <h1 class="text-lg font-bold leading-tight tracking-tight text-white">Access Control</h1>
            </div>
        </header>

        <main class="flex-1 flex flex-col p-4 gap-6">
            <!-- ACTIVE SESSIONS -->
            <section class="flex flex-col gap-3">
                <div class="flex items-center justify-between px-2">
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Active Sessions</h2>
                    <span id="active-count" class="section-badge bg-green-500/10 text-green-500">0 Live</span>
                </div>
                <div id="clients-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </section>

            <!-- BLACKLIST -->
            <section class="flex flex-col gap-3">
                <div class="flex items-center justify-between px-2">
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Blacklisted IPs</h2>
                    <span id="blocked-count" class="section-badge bg-red-500/10 text-red-500 font-bold">0 Blocked</span>
                </div>
                <div id="blacklist-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
            </section>

            <!-- Sync Loading -->
            <div id="sync-state" class="flex flex-col items-center justify-center py-10 text-slate-500 hidden">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary mb-2"></div>
                <p class="text-[10px] uppercase font-bold">Syncing security...</p>
            </div>
        </main>
    </div>

    <!-- Core Scripts - All as modules for Vite to process imports correctly -->
    <script type="module" src="/src/assets/js/utils.js"></script>
    <script type="module" src="/src/assets/js/components.js"></script>
    <script type="module">
        // Wait for components to be fully loaded and ready
        async function initializePageComponents() {
            try {
                if (window.Components && window.Components.ready) await window.Components.ready;
                if (window.Components && typeof window.Components.injectSidebar === 'function') {
                    window.Components.injectSidebar('hosting-access');
                    window.Components.injectModal();
                } else if (window.Components && window.Components.Sidebar && typeof window.Components.Sidebar.inject === 'function') {
                    window.Components.Sidebar.inject('hosting-access');
                }
            } catch (err) {
                console.error('Failed to initialize components:', err);
            }
        }
        initializePageComponents().catch(err => console.error('Failed to initialize:', err));
    </script>
    <script type="module">
        // Import hosting-access logic
        import('/src/assets/js/pages/hosting-access.js').then(module => {
            if (module.initHostingAccess) {
                module.initHostingAccess();
            }
        });
    </script>
    <script type="module">
        // Hosting access page logic - moved to module context
        const clientsList = document.getElementById('clients-list');
        const blacklistList = document.getElementById('blacklist-list');
        const activeBadge = document.getElementById('active-count');
        const blockedBadge = document.getElementById('blocked-count');

        async function fetchSecurityState() {
            try {
                const [clients, blacklist] = await Promise.all([
                    fetch('/api/ftp/server/connected-clients').then(r => r.json()),
                    fetch('/api/ftp/server/blacklist-client').then(r => r.json())
                ]);
                renderUI(clients || [], blacklist || []);
            } catch (e) {
                console.error('Security Sync Error:', e);
            }
        }

        function renderUI(clients, blacklist) {
            clientsList.innerHTML = '';
            activeBadge.innerText = `${clients.length} Live`;
            clients.forEach(c => {
                const card = document.createElement('div');
                card.className = "flex items-center justify-between p-4 bg-slate-800/40 rounded-2xl border border-white/5";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="size-11 rounded-full bg-green-500/10 flex items-center justify-center text-green-500">
                            <span class="material-symbols-outlined">person</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-white">${c.Name || 'User'}</span>
                            <span class="text-[10px] font-mono text-slate-500">${c.Host}:${c.Port}</span>
                        </div>
                    </div>
                    <button onclick="confirmBlock('${c.Host}')" class="size-10 rounded-full flex items-center justify-center text-slate-500 hover:text-danger hover:bg-danger/10 transition-colors">
                        <span class="material-symbols-outlined text-[20px]">block</span>
                    </button>
                `;
                clientsList.appendChild(card);
            });

            blacklistList.innerHTML = '';
            blockedBadge.innerText = `${blacklist.length} Blocked`;
            blacklist.forEach(ip => {
                const card = document.createElement('div');
                card.className = "flex items-center justify-between p-4 bg-slate-800/20 rounded-2xl border border-red-500/10";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="size-11 rounded-full bg-red-500/10 flex items-center justify-center text-red-500">
                            <span class="material-symbols-outlined">security</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-sm font-bold text-slate-200">${ip}</span>
                            <span class="text-[10px] text-red-400 font-bold uppercase">Blocked</span>
                        </div>
                    </div>
                    <button onclick="unblockIP('${ip}')" class="px-4 py-2 rounded-xl bg-primary/10 text-primary text-[10px] font-black hover:bg-primary/20 transition-all uppercase">Unblock</button>
                `;
                blacklistList.appendChild(card);
            });
        }

        window.confirmBlock = function(host) {
            window.Components.openGuiModal({
                title: 'Block Client IP?',
                message: `This will disconnect ${host} and prevent any further access until manually removed.`,
                icon: 'gavel',
                type: 'danger',
                primaryText: 'Block & Terminate',
                onPrimary: async () => {
                    const params = new URLSearchParams({ host });
                    const res = await fetch('/api/ftp/server/blacklist-client', { method: 'POST', body: params });
                    if (res.ok) { window.Components.showToast(`IP ${host} blocked`); fetchSecurityState(); }
                }
            });
        };

        window.unblockIP = async function(host) {
            const params = new URLSearchParams({ host });
            const res = await fetch('/api/ftp/server/whitelist-client', { method: 'POST', body: params });
            if (res.ok) { window.Components.showToast('Access restored'); fetchSecurityState(); }
        };

        setInterval(fetchSecurityState, 5000);
        fetchSecurityState();
    </script>
</body>

</html>
