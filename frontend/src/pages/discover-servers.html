<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Connect to Other Device - FTP Manager</title>
  <script type="module" src="/src/assets/vendor/tailwind-cdn.min.js"></script>
  <script type="module">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#50c2f7",
            "background-dark": "#101c22",
            "surface-dark": "#1b2327",
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/src/assets/css/fonts.css">
  <link rel="stylesheet" href="/src/assets/css/main.css">
</head>

<body v-cloak class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden">
  <div class="relative flex min-h-screen w-full flex-col max-w-none shadow-2xl bg-background-dark overflow-hidden">
    <header class="sticky top-0 z-20 bg-background-dark/95 backdrop-blur-md border-b border-white/5 p-4">
      <div class="flex items-center gap-3">
        <button onclick="Components.toggleMenu()"
          class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-slate-800 transition-colors">
          <span class="material-symbols-outlined text-3xl">menu</span>
        </button>
        <div class="flex flex-col">
          <h2 class="text-xl font-bold text-white">Connect to Other Device</h2>
        </div>
      </div>
    </header>

    <main class="flex flex-col gap-4 p-4">
    <div class="bg-white/5 rounded-2xl overflow-hidden border border-white/5 p-4 transition-all duration-300 cursor-pointer hover:border-primary/30 hover:bg-white/10" onclick="globalThis.Router.navigate('/discover/auto')">
      <div class="flex items-center gap-3">
        <div class="size-10 rounded-full bg-primary/10 flex items-center justify-center text-primary">
          <span class="material-symbols-outlined text-2xl">radar</span>
        </div>
        <div class="flex-1">
          <h3 class="text-white font-bold">Auto-Discovery</h3>
          <p class="text-[#9cb0ba] text-xs">Scan local network</p>
        </div>
        <span class="material-symbols-outlined text-primary">chevron_right</span>
      </div>
    </div>

    <div class="bg-white/5 rounded-2xl overflow-hidden border border-white/5 p-4 transition-all duration-300 cursor-pointer hover:border-violet-400/30 hover:bg-white/10" onclick="globalThis.Router.navigate('/discover/internet')">
      <div class="flex items-center gap-3">
        <div class="size-10 rounded-full bg-violet-500/10 flex items-center justify-center text-violet-400">
          <span class="material-symbols-outlined text-2xl">hub</span>
        </div>
        <div class="flex-1">
          <h3 class="text-white font-bold">Internet App-to-App</h3>
          <p class="text-[#9cb0ba] text-xs">Connect via invite link</p>
        </div>
        <span class="material-symbols-outlined text-violet-400">chevron_right</span>
      </div>
    </div>
  </main>
  </div>

  <script src="/wails/ipc.js"></script>
  <script src="/wails/runtime.js"></script>
  <script type="module" src="/src/assets/js/utils.js"></script>
  <script type="module" src="/src/assets/js/components.js"></script>
  <script type="module">
    async function initializePageComponents() {
      try {
        if (window.Components && window.Components.ready) await window.Components.ready;
        if (window.Components && typeof window.Components.injectSidebar === 'function') {
          window.Components.injectSidebar('discover-servers');
          window.Components.injectModal();
        } else if (window.Components && window.Components.Sidebar && typeof window.Components.Sidebar.inject === 'function') {
          window.Components.Sidebar.inject('discover-servers');
          if (window.Components.Sidebar && typeof window.Components.Sidebar.injectModal === 'function') window.Components.Sidebar.injectModal();
        } else {
          console.error('Components failed to load');
        }
      } catch (err) {
        console.error('Failed to initialize components:', err);
      }
    }
    initializePageComponents().catch(err => console.error('Failed to initialize:', err));
  </script>
</body>

</html>
