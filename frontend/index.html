<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FTP Server Manager Dashboard</title>

    <!-- Scripts & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="js/tailwind.config.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap"
        rel="stylesheet" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white transition-colors duration-200 h-screen overflow-hidden">

    <!-- Main Container: Full width/height for desktop, centered content -->
    <div class="relative flex h-full w-full flex-col overflow-hidden">

        <!-- Header -->
        <header
            class="flex items-center justify-between px-6 py-4 bg-background-dark/95 backdrop-blur-md sticky top-0 z-10 border-b border-gray-800">
            <div class="flex items-center gap-3">
                <div class="flex items-center justify-center w-10 h-10 rounded-xl bg-primary/10 text-primary">
                    <span class="material-symbols-outlined text-2xl">dns</span>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight tracking-tight text-white">FTP Manager</h1>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span class="relative flex h-2 w-2">
                            <span
                                class="animate-ping absolute inline-flex h-full w-full rounded-full bg-success opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2 w-2 bg-success"></span>
                        </span>
                        <span class="text-xs font-medium text-gray-400">Server Status: Ready</span>
                    </div>
                </div>
            </div>

            <button class="p-2 rounded-full hover:bg-white/5 transition-colors text-gray-400 hover:text-white">
                <span class="material-symbols-outlined">notifications</span>
            </button>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col lg:flex-row gap-6 p-6 overflow-hidden">

            <!-- Sidebar / Control Panel (Left Side on Desktop, Top on Mobile) -->
            <div class="w-full lg:w-1/3 xl:w-1/4 flex flex-col gap-6 flex-shrink-0">

                <!-- Status Card -->
                <div class="bg-surface-dark rounded-xl p-5 border border-gray-800 shadow-lg">
                    <div class="flex flex-col gap-3">
                        <span class="text-xs uppercase tracking-wider font-semibold text-gray-500">Connection URL</span>
                        <div
                            class="flex items-center justify-between bg-black/30 rounded-lg p-3 border border-gray-700/50">
                            <!-- ID: ftpUrl - Hidden by default until server starts -->
                            <code id="ftpUrl" class="font-mono text-status-text text-sm break-all hidden">...</code>
                            <span id="urlPlaceholder" class="font-mono text-gray-600 text-sm">Server Offline</span>
                            <button class="ml-2 text-gray-400 hover:text-white transition-colors" title="Copy URL">
                                <span class="material-symbols-outlined text-sm">content_copy</span>
                            </button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="grid grid-cols-2 gap-3 mt-5">
                        <button id="startBtn"
                            class="flex items-center justify-center gap-2 h-12 rounded-lg bg-success hover:bg-success/90 text-white font-semibold text-sm transition-all active:scale-95 shadow-lg shadow-success/20">
                            <span class="material-symbols-outlined text-xl">play_arrow</span>
                            Start Server
                        </button>
                        <button id="stopBtn" disabled
                            class="flex items-center justify-center gap-2 h-12 rounded-lg bg-danger hover:bg-danger/90 text-white font-semibold text-sm transition-all active:scale-95 shadow-lg shadow-danger/20 opacity-50 cursor-not-allowed">
                            <span class="material-symbols-outlined text-xl">stop</span>
                            Stop Server
                        </button>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-3 gap-3">
                    <div
                        class="bg-surface-dark p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center">
                        <span class="text-xs text-gray-500 mb-1">Uptime</span>
                        <span class="font-mono text-sm text-white font-medium">00:00:00</span>
                    </div>
                    <div
                        class="bg-surface-dark p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center">
                        <span class="text-xs text-gray-500 mb-1">Upload</span>
                        <span class="font-mono text-sm text-primary font-medium">0 KB/s</span>
                    </div>
                    <div
                        class="bg-surface-dark p-3 rounded-lg border border-gray-800 flex flex-col items-center justify-center text-center">
                        <span class="text-xs text-gray-500 mb-1">Download</span>
                        <span class="font-mono text-sm text-success font-medium">0 KB/s</span>
                    </div>
                </div>

            </div>

            <!-- Log Console (Right Side / Main Area) -->
            <!-- flex-1 ensures it takes remaining height. min-h-0 prevents overflow issues. -->
            <div
                class="flex-1 flex flex-col rounded-xl overflow-hidden border border-gray-800 shadow-inner min-h-0 bg-surface-dark">
                <div
                    class="bg-gray-900/80 px-4 py-3 flex justify-between items-center border-b border-gray-800 flex-shrink-0">
                    <span class="text-sm font-semibold text-gray-400 flex items-center gap-2">
                        <span class="material-symbols-outlined text-base">terminal</span>
                        Log Console
                    </span>
                    <div class="flex gap-2">
                        <div class="w-3 h-3 rounded-full bg-red-500/20 border border-red-500/50"></div>
                        <div class="w-3 h-3 rounded-full bg-yellow-500/20 border border-yellow-500/50"></div>
                        <div class="w-3 h-3 rounded-full bg-green-500/20 border border-green-500/50"></div>
                    </div>
                </div>

                <!-- Console Content -->
                <div id="console"
                    class="flex-1 bg-console-bg p-4 overflow-y-auto font-mono text-xs leading-relaxed custom-scrollbar relative">
                    <div class="text-log-text space-y-1 pb-4"> <!-- Added padding bottom for better scroll feel -->
                        <p><span class="text-gray-500">System:</span> Ready to connect...</p>
                        <div class="animate-pulse text-primary mt-2">_</div>
                    </div>
                    <!-- Invisible anchor for auto-scroll -->
                    <div id="scrollAnchor" class="h-0 w-0"></div>
                </div>
            </div>

        </main>

        <!-- Script for Logic -->
        <script src="js/app.js"></script>
    </div>
</body>

</html>
