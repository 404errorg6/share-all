<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Shared files - FTP Mini Server</title>
    
    <!-- Scripts & Styles from the Wails Assets Server -->
    <script src="/assets/vendor/tailwind-cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#50c2f7",
                        "background-dark": "#101c22",
                        "surface-dark": "#1b2327",
                    },
                    fontFamily: {
                        display: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        };
    </script>
    
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <link rel="stylesheet" href="/assets/css/main.css">
    
    <style>
        .glass-panel {
            background: rgba(27, 35, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

    </style>
</head>

<body class="bg-background-dark font-display text-slate-100 antialiased overflow-x-hidden selection:bg-primary/20">
    <!-- Background Decoration -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden -z-10">
        <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-blue-500/10 rounded-full blur-[120px]"></div>
    </div>

    <div class="relative flex min-h-screen w-full flex-col max-w-6xl mx-auto md:px-6">
        <!-- Header -->
        <header class="sticky top-0 z-30 bg-background-dark/80 backdrop-blur-xl border-b border-white/5 md:mt-8 md:rounded-t-[2rem] overflow-hidden">
            <div class="flex items-center p-6 justify-between">
                <div class="flex items-center gap-4">
                    <div class="text-primary flex size-12 items-center justify-center rounded-2xl bg-primary/10 border border-primary/20 shadow-lg shadow-primary/10">
                        <span class="material-symbols-outlined text-3xl">share</span>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold tracking-tight">Shared Content</h2>
                        <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest mt-0.5">Direct Access Portal</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="refresh-btn" class="flex items-center justify-center size-10 rounded-xl hover:bg-white/5 transition-all active:scale-95 text-slate-400 hover:text-white" title="Refresh">
                        <span class="material-symbols-outlined text-2xl">refresh</span>
                    </button>
                    <button id="upload-btn" class="flex items-center justify-center size-10 rounded-xl hover:bg-white/5 transition-all active:scale-95 text-slate-400 hover:text-white" title="Upload Files">
                        <span class="material-symbols-outlined text-2xl">upload</span>
                    </button>
                    <input type="file" id="file-input" class="hidden" multiple>
                </div>
            </div>
        </header>

        <!-- Path Breadcrumbs -->
        <div class="flex items-center gap-2 bg-white/5 px-6 py-4 border-b border-white/5">
            <button id="up-dir-btn" title="Parent Directory" class="flex items-center justify-center size-9 rounded-xl hover:bg-white/10 transition-all hover:text-primary shrink-0 border border-white/5">
                <span class="material-symbols-outlined text-[20px]">arrow_upward</span>
            </button>
            <div id="breadcrumb-path" class="flex items-center gap-1 overflow-x-auto scrollbar-hide flex-1 min-w-0">
                <!-- Breadcrumbs injected by JS -->
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col relative py-6" id="local-file-list">
            <div id="empty-state" class="flex flex-col items-center justify-center py-32 text-slate-500 text-center hidden">
                <div class="size-24 rounded-[3rem] bg-white/5 flex items-center justify-center mb-6 border border-white/5">
                    <span class="material-symbols-outlined text-5xl opacity-20">folder_open</span>
                </div>
                <p class="font-bold text-xl text-slate-300">No files found</p>
                <p class="text-sm opacity-60 mt-2 max-w-[240px]">This directory is empty or access was restricted.</p>
            </div>

            <div id="file-list-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 px-6 md:px-0">
                <!-- Entries injected by JS -->
            </div>

            <!-- Syncing/Loading State -->
            <div id="sync-overlay" class="absolute inset-0 bg-background-dark/60 backdrop-blur-sm z-30 flex items-center justify-center hidden">
                <div class="flex flex-col items-center gap-4">
                    <div class="animate-spin size-12 border-4 border-primary border-t-transparent rounded-full shadow-lg shadow-primary/20"></div>
                    <p class="text-[10px] font-black uppercase tracking-widest text-primary animate-pulse">Syncing Library</p>
                </div>
            </div>
        </main>

        <footer class="p-8 text-center border-t border-white/5 md:mb-8 md:bg-white/5 md:rounded-b-[2rem]">
            <p class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-600">Powered by Mini Server Architecture</p>
        </footer>
    </div>

    <!-- Modals -->
    <div id="options-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-6 bg-black/80 backdrop-blur-md">
        <div id="options-modal-content" class="glass-panel relative w-full max-w-[340px] rounded-[2.5rem] overflow-hidden shadow-2xl transition-all scale-95 opacity-0">
            <div class="p-8 border-b border-white/5 bg-white/5">
                <p id="options-filename" class="text-lg font-bold truncate text-white"></p>
                <p id="options-type" class="text-[10px] text-slate-500 uppercase tracking-[0.2em] font-black mt-1">Actions</p>
            </div>
            <div class="p-6 flex flex-col gap-3">
                <button id="btn-preview" class="flex items-center gap-4 w-full px-6 py-5 rounded-2xl hover:bg-primary/10 text-primary transition-all active:scale-95 group border border-transparent hover:border-primary/20">
                    <div class="size-10 rounded-xl bg-primary/10 flex items-center justify-center group-hover:bg-primary group-hover:text-background-dark transition-all">
                        <span class="material-symbols-outlined text-[22px]">visibility</span>
                    </div>
                    <span class="text-base font-bold">Preview</span>
                </button>
                <button id="btn-download" class="flex items-center gap-4 w-full px-6 py-5 rounded-2xl hover:bg-white/10 text-white transition-all active:scale-95 group border border-transparent hover:border-white/10">
                    <div class="size-10 rounded-xl bg-white/10 flex items-center justify-center group-hover:bg-white group-hover:text-background-dark transition-all">
                        <span class="material-symbols-outlined text-[22px]">download</span>
                    </div>
                    <span class="text-base font-bold">Download</span>
                </button>
            </div>
            <button onclick="closeOptionsModal()" class="w-full py-6 text-[10px] font-black uppercase tracking-[0.2em] text-slate-500 hover:text-white border-t border-white/5 bg-white/5 transition-colors">Cancel</button>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="fixed inset-0 z-[60] hidden flex flex-col bg-background-dark transition-all">
        <header class="flex items-center justify-between p-6 border-b border-white/5 bg-background-dark/95 backdrop-blur-xl">
            <div class="flex items-center gap-4 overflow-hidden">
                <button onclick="Preview.close()" class="size-10 flex items-center justify-center rounded-xl hover:bg-white/10 text-slate-200 transition-all border border-white/5">
                    <span class="material-symbols-outlined text-2xl">arrow_back</span>
                </button>
                <div class="flex flex-col overflow-hidden">
                    <p id="preview-filename" class="text-sm font-bold text-white truncate"></p>
                    <p class="text-[10px] text-primary font-black uppercase tracking-widest">Global Asset Reader</p>
                </div>
            </div>
        </header>
        <div class="flex-1 overflow-auto bg-black/40 flex items-center justify-center relative p-6">
            <div id="preview-container" class="w-full h-full flex items-center justify-center overflow-auto rounded-2xl border border-white/5 bg-white/5"></div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script type="module">
        // Import components and set up environment for share.js
        window.isSharePage = true;
        
        // Final corrected paths for universal assets (now in public/js)
        import Utils from '/assets/js/utils.js';
        import '/assets/js/components.js';
        
        window.Utils = Utils;
    </script>
    
    <script type="module" src="./share.js"></script>
</body>

</html>
