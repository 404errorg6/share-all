<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Browse Local - FTP Manager</title>
    <script src="/src/assets/vendor/tailwind-cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#50c2f7",
                        "background-dark": "#101c22",
                        "surface-dark": "#1b2327",
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="/src/assets/css/fonts.css">
    <link rel="stylesheet" href="/src/assets/css/main.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body v-cloak
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
    <div
        class="relative flex min-h-screen w-full flex-col max-w-6xl mx-auto shadow-2xl bg-background-light dark:bg-background-dark md:my-8 md:rounded-[2rem] overflow-hidden">
        <!-- Header -->
        <header
            class="sticky top-0 z-20 bg-background-light dark:bg-background-dark/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center p-4 justify-between">
                <div class="flex items-center gap-3">
                    <button onclick="Components.toggleMenu()"
                        class="text-primary flex size-10 items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-3xl">menu</span>
                    </button>
                    <h2 class="text-xl font-bold leading-tight tracking-tight">Local Storage</h2>
                </div>
            </div>
        </header>

        <!-- Path Breadcrumbs -->
        <div
            class="flex items-center gap-2 bg-slate-100 dark:bg-slate-900/50 px-4 py-3 border-b border-slate-200 dark:border-slate-800">
            <button id="up-dir-btn" title="Parent Directory"
                class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors shrink-0">
                <span class="material-symbols-outlined text-[20px]">arrow_upward</span>
            </button>
            <div id="breadcrumb-path" class="flex items-center gap-1 overflow-x-auto scrollbar-hide flex-1 min-w-0">
            </div>
        </div>

        <!-- Toolbar -->
        <div
            class="flex items-center gap-2 bg-slate-50 dark:bg-slate-800/30 px-4 py-2 border-b border-slate-200 dark:border-slate-800">
            <button id="refresh-btn"
                class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <span class="material-symbols-outlined text-[20px]">refresh</span>
            </button>
            <button id="toggle-hidden-btn"
                class="flex items-center justify-center size-9 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors opacity-50">
                <span class="material-symbols-outlined text-[20px]">visibility_off</span>
            </button>
            <div class="flex-1"></div>
            <button id="toggle-select-mode" onclick="toggleSelectionMode()"
                class="flex items-center justify-center gap-1.5 px-3 h-9 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-all border border-slate-200 dark:border-white/5 text-slate-400"
                title="Selection Mode">
                <span class="material-symbols-outlined text-[18px]">rule</span>
                <span class="text-[10px] font-black uppercase tracking-widest hidden sm:inline">Select</span>
            </button>
            <p id="file-count" class="text-xs text-slate-500 font-bold uppercase tracking-widest ml-2">0 items</p>
            <button id="select-folder-btn"
                class="hidden flex items-center justify-center gap-1.5 px-3 h-9 rounded-lg bg-success text-white font-bold ml-2 transition-all active:scale-95">
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
                <span class="text-[10px] uppercase tracking-widest">Select Folder</span>
            </button>
        </div>

        <main class="flex-1 flex flex-col pb-24 relative" id="local-file-list">
            <div id="empty-state"
                class="flex flex-col items-center justify-center h-full text-slate-400 p-8 text-center">
                <span class="material-symbols-outlined text-6xl mb-4 opacity-20">sd_storage</span>
                <p class="font-bold text-xl text-slate-600 dark:text-slate-300">Local Storage</p>
                <p class="text-sm opacity-60 mt-2 max-w-[240px]">Grant access or select a root directory to begin.</p>
                <button id="browse-btn"
                    class="mt-8 px-6 py-2 bg-primary/10 text-primary rounded-xl font-bold hover:bg-primary/20 transition-colors">
                    Browse Folders
                </button>
            </div>
            <div id="file-list-container"
                class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 p-4"></div>

            <!-- Loading Indicator Overlay -->
            <div id="sync-overlay"
                class="absolute inset-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm z-30 flex items-center justify-center hidden">
                <div class="flex flex-col items-center gap-4">
                    <div class="animate-spin size-10 border-4 border-primary border-t-transparent rounded-full"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Floating Selection Bar -->
    <div id="selection-bar"
        class="fixed bottom-24 left-1/2 -translate-x-1/2 z-30 hidden w-[calc(100%-48px)] max-w-sm transition-all duration-300">
        <div class="bg-primary shadow-2xl shadow-primary/30 rounded-2xl p-4 flex items-center justify-between">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="size-9 bg-white/20 rounded-lg flex items-center justify-center text-white">
                    <span class="material-symbols-outlined text-xl">rule</span>
                </div>
                <div class="flex flex-col overflow-hidden">
                    <p class="text-[10px] font-black uppercase tracking-widest text-white/70">Selected Items</p>
                    <p id="selection-info" class="text-xs font-bold text-white truncate"></p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="clearSelection()" class="p-2 text-white/70 hover:text-white">
                    <span class="material-symbols-outlined text-xl">close</span>
                </button>
                <button onclick="deleteSelected()"
                    class="px-5 py-2 bg-danger text-white rounded-xl font-black text-[10px] uppercase tracking-widest shadow-lg active:scale-95 transition-all">Delete
                    All</button>
            </div>
        </div>
    </div>

    <div id="options-modal"
        class="fixed inset-0 z-40 hidden flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
        <div id="options-modal-content"
            class="modal-container relative w-full max-w-[340px] glass-panel rounded-[2rem] overflow-hidden shadow-2xl">
            <div class="p-8 border-b border-white/5 bg-white/5">
                <p id="options-filename" class="text-lg font-bold truncate text-white"></p>
                <p id="options-type" class="text-[10px] text-slate-500 uppercase tracking-[0.2em] font-black mt-1">
                    Actions</p>
            </div>
            <div class="p-4 flex flex-col gap-2">
                <button id="btn-preview"
                    class="flex items-center gap-4 w-full px-6 py-5 rounded-2xl hover:bg-primary/10 text-primary transition-all active:scale-95 group">
                    <div
                        class="size-10 rounded-xl bg-primary/10 flex items-center justify-center group-hover:bg-primary group-hover:text-white transition-all">
                        <span class="material-symbols-outlined text-[22px]">visibility</span>
                    </div>
                    <span class="text-base font-bold">Preview</span>
                </button>
                <button id="btn-delete"
                    class="flex items-center gap-4 w-full px-6 py-5 rounded-2xl hover:bg-danger/10 text-danger transition-all active:scale-95 group">
                    <div
                        class="size-10 rounded-xl bg-danger/10 flex items-center justify-center group-hover:bg-danger group-hover:text-white transition-all">
                        <span class="material-symbols-outlined text-[22px]">delete</span>
                    </div>
                    <span class="text-base font-bold">Delete Item</span>
                </button>
            </div>
            <button onclick="closeOptionsModal()"
                class="w-full py-6 text-xs font-black uppercase tracking-[0.2em] text-slate-500 hover:text-white border-t border-white/5 transition-colors">Cancel</button>
        </div>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal"
        class="fixed inset-0 z-50 hidden flex flex-col bg-slate-50 dark:bg-background-dark transition-all">
        <header
            class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-white/5 bg-white/95 dark:bg-background-dark/95 backdrop-blur-md">
            <div class="flex items-center gap-3 overflow-hidden">
                <button onclick="Preview.close()"
                    class="size-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-white/10 text-slate-600 dark:text-slate-200">
                    <span class="material-symbols-outlined text-2xl">arrow_back</span>
                </button>
                <div class="flex flex-col overflow-hidden">
                    <p id="preview-filename" class="text-sm font-bold dark:text-white truncate"></p>
                    <p class="text-[10px] text-primary font-black uppercase tracking-widest">Local Preview</p>
                </div>
            </div>
        </header>
        <div class="flex-1 overflow-auto bg-slate-200 dark:bg-black/40 flex items-center justify-center relative">
            <div id="preview-container" class="w-full h-full p-4 flex items-center justify-center overflow-auto"></div>
        </div>
    </div>

    <!-- Core Scripts -->
<script type="module" src="/src/assets/js/utils.js"></script>
<script type="module" src="/src/assets/js/components.js"></script>
<script type="module" src="/src/assets/js/preview.js"></script>
<script type="module" src="/src/assets/js/pages/browse-local.js"></script>
</body>

</html>
