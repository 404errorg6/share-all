<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Browse Local - FTP Manager</title>
    <script src="/vendor/tailwind-cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#50c2f7",
                        "background-dark": "#101c22",
                        "surface-dark": "#1b2327",
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body v-cloak
    class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased overflow-x-hidden">
    <div
        class="relative flex min-h-screen w-full flex-col max-w-none shadow-2xl bg-background-light dark:bg-background-dark overflow-hidden">
        <!-- Header removed, now dynamic per page -->

        <!-- Dynamic Content Area -->

        <main class="flex-1 flex flex-col pb-24 relative" id="app-content">
            <!-- Content will be injected here by router.js -->
            <div class="flex items-center justify-center h-full">
                <div class="animate-spin size-10 border-4 border-primary border-t-transparent rounded-full"></div>
            </div>
        </main>
    </div>

    <!-- Core Scripts -->
    <script type="module" src="/src/assets/js/utils.js"></script>
    <script type="module" src="/src/assets/js/components.js"></script>
    <script type="module" src="/src/assets/js/router.js"></script>
</body>

</html>
